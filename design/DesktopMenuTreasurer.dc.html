</x-dc>
<script data-dc-script>
class Component extends DCLogic {
  componentDidMount() {
    var toast = document.getElementById('pf-toast');
    var toastText = document.getElementById('pf-toast-text');
    var hideTimer;
    function showToast(msg) {
      toastText.textContent = msg;
      toast.style.opacity = '1';
      toast.style.transform = 'translateY(0)';
      clearTimeout(hideTimer);
      hideTimer = setTimeout(function () {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(10px)';
      }, 2600);
    }
    var exportBtn = document.getElementById('pf-export-csv');
    var backupBtn = document.getElementById('pf-backup-data');
    if (exportBtn) exportBtn.addEventListener('click', function () { showToast('CSV exported'); });
    if (backupBtn) backupBtn.addEventListener('click', function () { showToast('Backup exported'); });
  }
}
</script>
