<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: #F5A623; }
    a:hover { color: #ffb733; }
    .icon { display: block; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .pf-fade { opacity: 0; animation: pfFadeUp .4s cubic-bezier(.22,1,.36,1) both; }
    @keyframes pfFadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pfSheetUp { from { opacity: 0; transform: translateY(28px); } to { opacity: 1; transform: translateY(0); } }
    .pf-sheet { animation: pfSheetUp .38s cubic-bezier(.22,1,.36,1) both; }
    .pf-chip:active { transform: scale(0.95); }
    .pf-cta:active { transform: scale(0.97); }
    input::placeholder { color: rgba(147,162,184,0.55); }
    input:focus { outline: none; border-color: #F5A623 !important; }
    @media (prefers-reduced-motion: reduce) {
      .pf-fade, .pf-sheet { animation: none; opacity: 1; }
    }
  </style>
</helmet>

<div style="position:relative; width:390px; height:640px; overflow:hidden; background:#0D1B2A; border-radius:38px; border:1px solid rgba(255,255,255,0.08); font-family:'Inter',sans-serif; color:#EDEFF2;">

  <!-- dimmed backdrop hint -->
  <div class="pf-fade" style="padding:28px 20px 0; opacity:0.28; filter:blur(1.5px); animation-delay:0s;">
    <div style="font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:20px;">Menu</div>
  </div>
  <div style="position:absolute; inset:0; background:rgba(5,10,18,0.55);"></div>

  <!-- bottom sheet -->
  <div class="pf-sheet" style="position:absolute; left:0; right:0; bottom:0; background:linear-gradient(180deg, rgba(20,42,66,0.97), rgba(13,27,42,0.99)); border-top:1px solid rgba(255,255,255,0.14); border-radius:26px 26px 0 0; box-shadow:0 -20px 50px -20px rgba(0,0,0,0.7); padding:12px 22px calc(24px + env(safe-area-inset-bottom, 0px));">

    <div style="width:36px; height:4px; border-radius:3px; background:rgba(255,255,255,0.18); margin:0 auto 16px;"></div>

    <div style="display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:22px;">
      <div style="font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:19px;">Edit Profile</div>
      <button class="pf-chip" style="width:32px; height:32px; border-radius:50%; background:rgba(255,255,255,0.08); border:none; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;">
        <svg class="icon" viewBox="0 0 24 24" style="width:15px; height:15px; color:#EDEFF2;"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
      </button>
    </div>

    <!-- avatar: tap to change photo -->
    <div style="display:flex; justify-content:center; margin-bottom:24px;">
      <button class="pf-chip" style="position:relative; width:76px; height:76px; border-radius:50%; background:#1B3A57; border:none; padding:0; display:flex; align-items:center; justify-content:center; font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:26px; color:#EDEFF2; box-shadow:0 0 0 3px #9B7FE0; cursor:pointer;">
        C
        <span style="position:absolute; bottom:0; right:0; width:26px; height:26px; border-radius:50%; background:#F5A623; border:2.5px solid #0D1B2A; display:flex; align-items:center; justify-content:center;">
          <svg class="icon" viewBox="0 0 24 24" style="width:13px; height:13px; color:#14213D; stroke-width:2.6;">
            <path d="M4 8h3l1.6-2.4A2 2 0 0 1 10.3 4.6h3.4a2 2 0 0 1 1.7 1L17 8h3a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-9a2 2 0 0 1 2-2Z"/>
            <circle cx="12" cy="14" r="3.6"/>
          </svg>
        </span>
      </button>
    </div>

    <!-- name -->
    <div style="font-size:11px; color:#93A2B8; text-transform:uppercase; letter-spacing:.04em; margin-bottom:8px;">Display name</div>
    <input id="pf-name-input" value="Cathy" style="width:100%; padding:14px 16px; border-radius:14px; background:rgba(20,42,66,0.5); border:1.5px solid rgba(255,255,255,0.14); color:#EDEFF2; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:16px; margin-bottom:6px;">
    <div id="pf-name-hint" style="font-size:11px; color:#93A2B8; line-height:1.5; margin-bottom:22px;">Visible to the rest of the group. Must be unique.</div>

    <button id="pf-save-btn" class="pf-cta" style="width:100%; height:52px; border:none; border-radius:16px; background:linear-gradient(135deg, #F5A623, #FFC966); color:#14213D; font-family:'Inter',sans-serif; font-weight:700; font-size:14.5px; cursor:pointer; box-shadow:0 12px 22px -10px rgba(245,166,35,0.5); transition:transform .1s ease;">Save Changes</button>
    <button class="pf-chip" style="width:100%; text-align:center; background:none; border:none; color:#93A2B8; font-family:'Inter',sans-serif; font-size:13px; font-weight:600; cursor:pointer; padding:12px 0 2px;">Cancel</button>
  </div>

</div>
</x-dc>
<script data-dc-script>
class Component extends DCLogic {
  componentDidMount() {
    var input = document.getElementById('pf-name-input');
    var hint = document.getElementById('pf-name-hint');
    var btn = document.getElementById('pf-save-btn');
    var taken = ['ana', 'ben', 'dan', 'elena'];
    function check() {
      var v = (input.value || '').trim();
      if (!v) {
        hint.textContent = 'Name can\'t be empty.';
        hint.style.color = '#E15353';
        btn.disabled = true;
        btn.style.opacity = '0.5';
        return;
      }
      if (taken.indexOf(v.toLowerCase()) !== -1) {
        hint.textContent = 'That name is already taken by another member.';
        hint.style.color = '#E15353';
        btn.disabled = true;
        btn.style.opacity = '0.5';
        return;
      }
      hint.textContent = 'Visible to the rest of the group. Must be unique.';
      hint.style.color = '#93A2B8';
      btn.disabled = false;
      btn.style.opacity = '1';
    }
    if (input) input.addEventListener('input', check);
  }
}
</script>
</body>
</html>
