<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    .icon { display: block; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .pf-modal { opacity: 0; animation: pfModalIn .32s cubic-bezier(.22,1,.36,1) both; }
    @keyframes pfModalIn { from { opacity: 0; transform: translate(-50%,-50%) translateY(10px) scale(0.98); } to { opacity: 1; transform: translate(-50%,-50%) translateY(0) scale(1); } }
    .pf-chip:hover { opacity: 0.8; }
    .pf-cta:active { transform: scale(0.98); }
    input[type="range"] { -webkit-appearance: none; appearance: none; height: 4px; border-radius: 3px; background: rgba(255,255,255,0.15); outline: none; }
    input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: #F5A623; cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,0.4); }
    input[type="range"]::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: #F5A623; border: none; cursor: pointer; }
  </style>
</helmet>

<div style="position:relative; width:1440px; height:900px; overflow:hidden; background:#0D1B2A; border-radius:16px; border:1px solid rgba(255,255,255,0.08); font-family:'Inter',sans-serif; color:#EDEFF2;">

  <div style="opacity:0.35; filter:blur(1.5px); display:flex; height:100%;">
    <div style="width:240px; height:100%; background:rgba(255,255,255,0.02); border-right:1px solid rgba(255,255,255,0.08);"></div>
    <div style="flex:1; padding:32px 40px;"><div style="font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:24px;">Menu</div></div>
  </div>
  <div style="position:absolute; inset:0; background:rgba(5,10,18,0.65);"></div>

  <div class="pf-modal" style="position:absolute; top:50%; left:50%; width:440px; background:linear-gradient(180deg, rgba(20,42,66,0.98), rgba(13,27,42,0.99)); border:1px solid rgba(255,255,255,0.12); border-radius:22px; box-shadow:0 30px 80px -20px rgba(0,0,0,0.7); overflow:hidden;">

    <!-- top bar -->
    <div style="display:flex; align-items:center; justify-content:space-between; padding:20px 24px;">
      <button class="pf-chip" style="background:none; border:none; color:#93A2B8; font-family:'Inter',sans-serif; font-size:13.5px; font-weight:600; cursor:pointer;">Cancel</button>
      <div style="font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:15px;">Crop Photo</div>
      <button id="pf-crop-save" class="pf-cta" style="background:#F5A623; border:none; border-radius:10px; padding:8px 16px; color:#14213D; font-family:'Inter',sans-serif; font-size:13px; font-weight:700; cursor:pointer;">Save</button>
    </div>

    <!-- crop stage -->
    <div style="position:relative; width:100%; height:340px; overflow:hidden; background:#000;">
      <div id="pf-crop-photo" style="position:absolute; inset:0; background:linear-gradient(145deg,#3a5f7d,#8a5a3c 55%,#c98a4a); display:flex; align-items:center; justify-content:center; transform:scale(1); transition:transform .05s linear;">
        <svg viewBox="0 0 24 24" style="width:160px; height:160px; color:rgba(255,255,255,0.35); fill:currentColor; stroke:none;">
          <circle cx="12" cy="8.5" r="4.2"/>
          <path d="M4 21c0-4.5 3.5-7.5 8-7.5s8 3 8 7.5"/>
        </svg>
      </div>
      <div style="position:absolute; top:50%; left:50%; width:240px; height:240px; transform:translate(-50%,-50%); border-radius:50%; box-shadow:0 0 0 2000px rgba(0,0,0,0.62); border:2px solid rgba(255,255,255,0.85); pointer-events:none;"></div>
    </div>

    <!-- controls -->
    <div style="padding:20px 26px 26px;">
      <div style="display:flex; align-items:center; gap:14px; margin-bottom:10px;">
        <svg class="icon" viewBox="0 0 24 24" style="width:14px; height:14px; color:#93A2B8; flex-shrink:0;"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
        <input id="pf-zoom-slider" type="range" min="100" max="200" value="100" style="flex:1;">
        <svg class="icon" viewBox="0 0 24 24" style="width:16px; height:16px; color:#93A2B8; flex-shrink:0;"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
      </div>
      <div style="text-align:center; font-size:12px; color:#93A2B8;">Drag to reposition &middot; Scroll to zoom</div>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script>
class Component extends DCLogic {
  componentDidMount() {
    var slider = document.getElementById('pf-zoom-slider');
    var photo = document.getElementById('pf-crop-photo');
    if (slider && photo) slider.addEventListener('input', function () {
      var scale = slider.value / 100;
      photo.style.transform = 'scale(' + scale + ')';
    });
    var save = document.getElementById('pf-crop-save');
    if (save) save.addEventListener('click', function () {
      save.textContent = 'Saved';
      save.style.opacity = '0.6';
    });
  }
}
</script>
</body>
</html>
