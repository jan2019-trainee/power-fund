<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Power Fund Tracker</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap');

:root {
  --bg-primary: #0D1B2A;
  --bg-card: #142A42;
  --bg-card-alt: #1B3A57;
  --accent: #F5A623;
  --accent-soft: rgba(245, 166, 35, 0.14);
  --success: #4CAF83;
  --success-soft: rgba(76, 175, 131, 0.14);
  --text-primary: #EDEFF2;
  --text-muted: #93A2B8;
  --border: rgba(255,255,255,0.08);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-family: 'Inter', sans-serif;
  padding: 28px 16px 60px;
  min-height: 100vh;
}

.wrap { max-width: 760px; margin: 0 auto; }

@media (max-width: 480px) {
  body { padding: 20px 10px 48px; }
  .battery-hero, .modal, .footer-note { padding-left: 16px; padding-right: 16px; }
  .round-body { padding-left: 10px; padding-right: 10px; }
  .title { font-size: 22px; }
  .battery-amount { font-size: 25px; }
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 16px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}

.due-countdown {
  margin-bottom: 16px;
  padding: 12px 16px;
  border-radius: 10px;
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 600;
  font-size: 15px;
  text-align: center;
  border: 1px solid var(--border);
}
.due-countdown.due-normal { background: var(--bg-card); color: var(--text-primary); }
.due-countdown.due-soon { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
.due-countdown.due-urgent { background: rgba(225,83,83,0.14); color: #E15353; border-color: #E15353; }

.save-error-banner {
  margin-bottom: 16px;
  padding: 10px 14px;
  border-radius: 9px;
  background: rgba(225,83,83,0.14);
  border: 1px solid #E15353;
  color: #E15353;
  font-size: 12.5px;
  text-align: center;
}

.title {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 26px;
  font-weight: 700;
  margin: 0 0 4px;
}

.subtitle {
  color: var(--text-muted);
  font-size: 14px;
  margin: 0;
}

.unlock-btn {
  background: var(--bg-card);
  border: 1px solid var(--border);
  color: var(--text-primary);
  font-family: 'Inter', sans-serif;
  font-size: 13px;
  font-weight: 500;
  padding: 9px 16px;
  border-radius: 8px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 7px;
  transition: border-color 0.15s ease;
}
.unlock-btn:hover { border-color: var(--accent); }
.unlock-btn.unlocked { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

/* Battery hero */
.battery-hero {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 24px;
  margin-bottom: 24px;
}
.battery-hero-top {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 14px;
  flex-wrap: wrap;
  gap: 8px;
}
.battery-amount {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 30px;
  font-weight: 700;
}
.battery-amount span { color: var(--text-muted); font-size: 17px; font-weight: 500; }
.battery-meta { color: var(--text-muted); font-size: 13px; }

.battery-shell {
  position: relative;
  height: 42px;
  border: 2.5px solid var(--border);
  border-radius: 8px;
  padding: 4px;
  display: flex;
}
.battery-shell::after {
  content: '';
  position: absolute;
  right: -9px;
  top: 50%;
  transform: translateY(-50%);
  width: 6px;
  height: 16px;
  background: var(--border);
  border-radius: 0 3px 3px 0;
}
.battery-fill {
  background: linear-gradient(90deg, #E8941A, var(--accent));
  border-radius: 4px;
  height: 100%;
  width: 0%;
  transition: width 0.8s cubic-bezier(0.22, 1, 0.36, 1);
}

.cycle-note {
  margin-top: 12px;
  font-size: 13px;
  color: var(--text-muted);
}
.cycle-note b { color: var(--text-primary); font-weight: 600; }

/* Member cards */
.section-label {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 15px;
  font-weight: 600;
  margin: 0 0 12px;
  color: var(--text-primary);
}

.member-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(135px, 1fr));
  gap: 10px;
  margin-bottom: 28px;
}

.member-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-left: 3px solid var(--border);
  border-radius: 10px;
  padding: 14px;
  position: relative;
}
.member-card.paid-out { border-left-color: var(--success); }

.member-order-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}
.member-order-num {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 12px;
  color: var(--text-muted);
}
.member-name {
  font-weight: 600;
  font-size: 15px;
  margin: 0 0 6px;
}
.member-contrib {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 18px;
  font-weight: 600;
  color: var(--accent);
}
.member-contrib-label { font-size: 11px; color: var(--text-muted); margin-bottom: 2px; }
.member-payout-date { font-size: 12px; color: var(--text-muted); margin-top: 8px; }
.overdue-badge {
  display: inline-block;
  margin-top: 8px;
  font-size: 11px;
  font-weight: 600;
  color: #E15353;
  background: rgba(225,83,83,0.12);
  padding: 3px 8px;
  border-radius: 20px;
}

.reorder-arrows {
  display: flex;
  gap: 4px;
}
.reorder-arrows button {
  background: var(--bg-card-alt);
  border: none;
  color: var(--text-primary);
  width: 22px;
  height: 22px;
  border-radius: 5px;
  cursor: pointer;
  font-size: 11px;
  line-height: 1;
}
.reorder-arrows button:disabled { opacity: 0.25; cursor: default; }

.status-chip {
  display: inline-block;
  font-size: 11px;
  font-weight: 600;
  padding: 3px 8px;
  border-radius: 20px;
  background: var(--success-soft);
  color: var(--success);
  margin-top: 8px;
}

/* Rounds */
.round {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 12px;
  margin-bottom: 12px;
  overflow: hidden;
}
.round-header {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  padding: 14px 16px;
  cursor: pointer;
  gap: 4px;
}
.round-header:hover { background: var(--bg-card-alt); }
.round-title {
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 600;
  font-size: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.round-num {
  color: var(--text-muted);
  font-weight: 500;
}
.round-status { font-size: 12px; color: var(--text-muted); padding-left: 20px; }
.round-chevron { color: var(--text-muted); font-size: 12px; transition: transform 0.2s ease; }
.round-chevron.open { transform: rotate(90deg); }

.round-body { padding: 0 16px 16px; display: none; }
.round-body.open { display: block; }

.cycle-list { display: flex; flex-direction: column; gap: 2px; margin-top: 4px; }
.cycle-row {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 10px 8px;
  border-bottom: 1px solid var(--border);
}
.cycle-row:last-child { border-bottom: none; }
.cycle-row.current-row { background: var(--accent-soft); border-radius: 8px; border-bottom-color: transparent; }
.cycle-date { font-size: 12px; color: var(--text-muted); }
.cycle-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.member-chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 5px 9px;
  border-radius: 20px;
  border: 1.5px solid var(--border);
  font-size: 11.5px;
  font-weight: 500;
  color: var(--text-muted);
  background: transparent;
  white-space: nowrap;
}
.member-chip.editable { cursor: pointer; }
.member-chip.paid { background: var(--success-soft); border-color: var(--success); color: var(--success); }
.member-chip.pending { background: rgba(245,166,35,0.16); border-color: var(--accent); color: var(--accent); }
.member-chip.overdue { border-color: #E15353; color: #E15353; background: rgba(225,83,83,0.1); }
.today-tag {
  display: inline-block;
  background: var(--accent);
  color: #14213D;
  font-size: 9.5px;
  font-weight: 700;
  padding: 1px 6px;
  border-radius: 20px;
  margin-left: 4px;
  vertical-align: middle;
}

.check {
  width: 28px;
  height: 28px;
  border-radius: 7px;
  border: 1.5px solid var(--border);
  background: transparent;
  cursor: default;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  color: var(--success);
}
.check.paid { background: var(--success-soft); border-color: var(--success); }
.check.editable { cursor: pointer; }
.check.editable:hover { border-color: var(--accent); }

.footer-note {
  margin-top: 24px;
  padding: 16px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 10px;
  font-size: 12.5px;
  color: var(--text-muted);
  line-height: 1.6;
}
.footer-note b { color: var(--text-primary); }

.activity-section { margin-bottom: 12px; }
.activity-list { max-height: 320px; overflow-y: auto; }
.activity-item {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 9px 0;
  border-bottom: 1px solid var(--border);
  font-size: 12.5px;
}
.activity-item:last-child { border-bottom: none; }
.activity-time { color: var(--text-muted); font-size: 11px; }
.activity-text { color: var(--text-primary); }
.activity-empty { color: var(--text-muted); font-size: 13px; text-align: center; padding: 12px 0; }

.how-it-works-list {
  margin: 8px 0 0;
  padding-left: 18px;
}
.how-it-works-list li { margin-bottom: 6px; }
.how-it-works-list li:last-child { margin-bottom: 0; }

.reset-row { margin-top: 18px; text-align: right; display: flex; align-items: center; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.reset-confirm-text { font-size: 12.5px; color: #E15353; margin-right: 4px; }
.reset-btn.confirm-yes { border-color: #E15353; color: #E15353; }
.reset-btn {
  background: none;
  border: 1px solid var(--border);
  color: var(--text-muted);
  font-size: 12px;
  padding: 7px 12px;
  border-radius: 7px;
  cursor: pointer;
}
.reset-btn:hover { border-color: #E15353; color: #E15353; }

.loading {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-muted);
}

/* Contribute button + pending state */
.contribute-btn {
  margin-top: 10px;
  width: 100%;
  background: var(--accent-soft);
  border: 1px solid var(--accent);
  color: var(--accent);
  font-family: 'Inter', sans-serif;
  font-size: 12.5px;
  font-weight: 600;
  padding: 8px 10px;
  border-radius: 7px;
  cursor: pointer;
}
.contribute-btn:hover { background: rgba(245,166,35,0.24); }

.check.pending { background: rgba(245,166,35,0.16); border-color: var(--accent); color: var(--accent); }
.check.overdue { border-color: #E15353; color: #E15353; background: rgba(225,83,83,0.1); }

.pending-note {
  font-size: 11px;
  color: var(--accent);
  margin-top: 6px;
}

/* Modal */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(5,10,18,0.72);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 50;
  padding: 20px;
}
.modal {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 24px;
  max-width: 360px;
  width: 100%;
  text-align: center;
}
.modal h3 {
  font-family: 'Space Grotesk', sans-serif;
  margin: 0 0 4px;
  font-size: 18px;
}
.modal p.modal-sub {
  color: var(--text-muted);
  font-size: 13px;
  margin: 0 0 18px;
}
.qr-box {
  background: #fff;
  border-radius: 10px;
  width: 200px;
  height: 200px;
  margin: 0 auto 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #0D1B2A;
  font-size: 12px;
  padding: 12px;
  text-align: center;
  line-height: 1.5;
}
.qr-box img { max-width: 100%; max-height: 100%; border-radius: 6px; }
.download-qr-btn {
  display: block;
  text-align: center;
  font-size: 12.5px;
  font-weight: 600;
  color: var(--accent);
  text-decoration: none;
  margin: -8px 0 16px;
  padding: 8px;
  border-radius: 7px;
  background: var(--accent-soft);
}
.download-qr-btn:hover { background: rgba(245,166,35,0.24); }
.modal-amount {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 24px;
  font-weight: 700;
  color: var(--accent);
  margin-bottom: 4px;
}
.modal-meta { color: var(--text-muted); font-size: 12.5px; margin-bottom: 18px; }
.advance-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--bg-card-alt);
  border-radius: 9px;
  padding: 10px 12px;
  margin-bottom: 16px;
}
.advance-label { font-size: 12.5px; color: var(--text-muted); }
.stepper { display: flex; align-items: center; gap: 10px; }
.stepper button {
  width: 26px;
  height: 26px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--bg-card);
  color: var(--text-primary);
  font-size: 15px;
  cursor: pointer;
  line-height: 1;
}
.stepper button:disabled { opacity: 0.3; cursor: default; }
.stepper-count {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 13px;
  font-weight: 600;
  min-width: 60px;
  text-align: center;
}
.modal-actions { display: flex; flex-direction: column; gap: 8px; }
.modal-btn-primary {
  background: var(--accent);
  border: none;
  color: #14213D;
  font-family: 'Inter', sans-serif;
  font-weight: 700;
  font-size: 14px;
  padding: 12px;
  border-radius: 9px;
  cursor: pointer;
}
.modal-btn-secondary {
  background: none;
  border: 1px solid var(--border);
  color: var(--text-muted);
  font-size: 13px;
  padding: 10px;
  border-radius: 9px;
  cursor: pointer;
}
.modal-btn-secondary.reject { border-color: #E15353; color: #E15353; }
.modal-btn-primary.confirm-yes { background: #E15353; color: #fff; }
.reject-confirm-text {
  font-size: 12.5px;
  color: #E15353;
  margin: 0 0 4px;
  line-height: 1.5;
}

.proof-upload {
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg-card-alt);
  border: 1px dashed var(--border);
  border-radius: 9px;
  padding: 12px;
  margin-bottom: 16px;
  cursor: pointer;
  min-height: 40px;
}
.proof-upload:hover { border-color: var(--accent); }
.proof-upload-label { font-size: 12.5px; color: var(--text-muted); }
.proof-preview { max-width: 100%; max-height: 140px; border-radius: 6px; }

.pin-input {
  width: 100%;
  background: var(--bg-card-alt);
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 12px;
  margin-bottom: 8px;
  color: var(--text-primary);
  font-family: 'Space Grotesk', sans-serif;
  font-size: 18px;
  letter-spacing: 4px;
  text-align: center;
  box-sizing: border-box;
}
.pin-input:focus { outline: none; border-color: var(--accent); }
.pin-error { color: #E15353; font-size: 12px; margin: 0 0 12px; text-align: center; }

.name-input {
  font-family: 'Inter', sans-serif;
  font-size: 14px;
  letter-spacing: normal;
  text-align: left;
  margin-bottom: 10px;
}
.edit-names-modal { text-align: left; }
.edit-names-modal h3, .edit-names-modal .modal-sub { text-align: center; }

.payout-done-tag {
  font-size: 11px;
  font-weight: 600;
  color: var(--success);
  background: var(--success-soft);
  padding: 2px 8px;
  border-radius: 20px;
  margin-left: 6px;
}
.payout-status-box {
  margin-top: 12px;
  padding: 10px 12px;
  background: var(--success-soft);
  border-radius: 8px;
  font-size: 12.5px;
  color: var(--success);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.payout-btn { margin-top: 12px; }
.payout-note-input {
  width: 100%;
  min-height: 70px;
  background: var(--bg-card-alt);
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 10px;
  margin-bottom: 16px;
  color: var(--text-primary);
  font-family: 'Inter', sans-serif;
  font-size: 13px;
  resize: vertical;
  box-sizing: border-box;
}
.payout-note-input:focus { outline: none; border-color: var(--accent); }

.share-btn {
  margin-top: 14px;
  width: 100%;
  background: var(--bg-card-alt);
  border: 1px solid var(--border);
  color: var(--text-primary);
  font-family: 'Inter', sans-serif;
  font-size: 13px;
  font-weight: 600;
  padding: 10px;
  border-radius: 8px;
  cursor: pointer;
}
.share-btn:hover { border-color: var(--accent); color: var(--accent); }

.share-text-area {
  width: 100%;
  min-height: 160px;
  background: var(--bg-card-alt);
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 12px;
  margin-bottom: 12px;
  color: var(--text-primary);
  font-family: 'Inter', sans-serif;
  font-size: 13px;
  line-height: 1.6;
  white-space: pre-wrap;
  resize: vertical;
  box-sizing: border-box;
  text-align: left;
}
.share-text-area:focus { outline: none; border-color: var(--accent); }
.copy-feedback { color: var(--success); font-size: 12px; margin: -4px 0 12px; text-align: center; }
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="loading">Loading fund data…</div>
</div>

<script>
const STORAGE_KEY = 'power-fund-state-v1';
const CYCLES_PER_ROUND = 6;
const CONTRIBUTION_PER_CYCLE = 1000;
const GOAL_PER_PERSON = 30000;
const TOTAL_ROUNDS = 5;
const TOTAL_CYCLES = CYCLES_PER_ROUND * TOTAL_ROUNDS;
const TOTAL_GOAL = GOAL_PER_PERSON * TOTAL_ROUNDS;

let state = null;
let unlocked = false;
let openRound = null;
let hasAutoOpened = false;
let modalTarget = null; // { memberId, cycleNumber }
let modalCount = 1;
let modalProofDataUrl = null;
let reviewTarget = null; // { memberId, cycleNumber } — treasurer reviewing a pending claim
let rejectConfirming = false;
let resetConfirming = false;
let pinModalMode = null; // null | 'setup' | 'enter' | 'change'
let pinInputValue = '';
let pinError = null;
let payoutModalRound = null;
let payoutNoteValue = '';
let activityLogOpen = false;
let saveError = null;
let shareModalOpen = false;
let copyFeedback = null;
let editNamesModalOpen = false;
let editNamesValues = {};
let editNamesError = null;

function maxAdvanceCount(memberId, cycleNumber) {
  // How many consecutive unpaid cycles (starting here) can be paid at once
  let count = 0;
  for (let c = cycleNumber; c <= TOTAL_CYCLES; c++) {
    if (getStatus(memberId, c) === 0) count++;
    else break;
  }
  return count;

function addDays(dateStr, days) {
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + days);
  return d;
}

function formatDate(d) {
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

function lastDayOfMonth(year, month) {
  return new Date(year, month + 1, 0).getDate();
}

function cycleDueDate(cycleNumber) {
  // Cycle 1 = Sep 15, 2026. Odd cycles land on the 15th, even cycles on the
  // last day of that same month, advancing one month every 2 cycles.
  const baseYear = 2026;
  const baseMonth = 8; // September, 0-indexed
  const monthOffset = Math.floor((cycleNumber - 1) / 2);
  const totalMonthIndex = baseMonth + monthOffset;
  const year = baseYear + Math.floor(totalMonthIndex / 12);
  const month = ((totalMonthIndex % 12) + 12) % 12;
  const isSecondHalf = (cycleNumber - 1) % 2 === 1;
  const day = isSecondHalf ? lastDayOfMonth(year, month) : 15;
  return new Date(year, month, day);
}

function migrateState(s) {
  // Older versions stored payments as raw numbers (0/1/2) instead of
  // { status, proof } objects. Convert any leftover entries in place.
  if (s && s.payments) {
    Object.keys(s.payments).forEach(key => {
      if (typeof s.payments[key] === 'number') {
        s.payments[key] = { status: s.payments[key], proof: null };
      }
    });
  }
  if (s && !('treasurerPin' in s)) s.treasurerPin = null;
  if (s && !s.payouts) s.payouts = {};
  if (s && !s.activityLog) s.activityLog = [];
  return s;
}

async function loadState() {
  try {
    const result = await window.storage.get(STORAGE_KEY, true);
    state = result ? migrateState(JSON.parse(result.value)) : defaultState();
  } catch (e) {
    state = defaultState();
  }
  render();
}

async function saveState() {
  try {
    await window.storage.set(STORAGE_KEY, JSON.stringify(state), true);
    if (saveError) { saveError = null; render(); }
  } catch (e) {
    console.error('Save failed', e);
    saveError = 'Your last change may not have saved — check your connection and try again.';
    render();
  }
}

function getStatus(memberId, cycleNumber) {
  const entry = state.payments[memberId + '-' + cycleNumber];
  return entry ? entry.status : 0;
}

function getProof(memberId, cycleNumber) {
  const entry = state.payments[memberId + '-' + cycleNumber];
  return entry ? entry.proof : null;
}

function applyStatus(memberId, cycleNumber, value, proof) {
  const key = memberId + '-' + cycleNumber;
  if (value === 0) {
    delete state.payments[key];
  } else {
    const existing = state.payments[key] || {};
    state.payments[key] = {
      status: value,
      proof: proof !== undefined ? proof : (existing.proof || null)
    };
  }
}

function setStatus(memberId, cycleNumber, value, proof) {
  applyStatus(memberId, cycleNumber, value, proof);
  saveState();
  render();
}

function openContributeModal(memberId, cycleNumber) {
  modalTarget = { memberId, cycleNumber };
  modalCount = 1;
  modalProofDataUrl = null;
  render();
}

function closeModal() {
  modalTarget = null;
  modalProofDataUrl = null;
  render();
}

function adjustModalCount(delta) {
  if (!modalTarget) return;
  const max = maxAdvanceCount(modalTarget.memberId, modalTarget.cycleNumber);
  modalCount = Math.min(max, Math.max(1, modalCount + delta));
  render();
}

function onProofSelected(input) {
  const file = input.files && input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    modalProofDataUrl = reader.result;
    render();
  };
  reader.readAsDataURL(file);
}

function markPending() {
  if (!modalTarget) return;
  const { memberId, cycleNumber } = modalTarget;
  for (let i = 0; i < modalCount; i++) {
    applyStatus(memberId, cycleNumber + i, 1, modalProofDataUrl);
  }
  const range = modalCount > 1 ? `cycles ${cycleNumber}–${cycleNumber + modalCount - 1}` : `cycle ${cycleNumber}`;
  logActivity(`${memberName(memberId)} marked ${range} as sent`);
  closeModal();
}

function cellClicked(memberId, cycleNumber) {
  const status = getStatus(memberId, cycleNumber);
  if (unlocked) {
    if (status === 1) {
      openReviewModal(memberId, cycleNumber);
    } else if (status === 2) {
      applyStatus(memberId, cycleNumber, 0);
      logActivity(`Treasurer reverted ${memberName(memberId)}'s cycle ${cycleNumber} to unpaid`);
      render();
    } else {
      // Treasurer recording a payment directly (e.g. cash, no member self-report)
      applyStatus(memberId, cycleNumber, 2);
      logActivity(`Treasurer recorded ${memberName(memberId)}'s cycle ${cycleNumber} as paid (direct)`);
      render();
    }
  } else {
    // Member: only act on unpaid cells, opens contribute modal
    if (status === 0) openContributeModal(memberId, cycleNumber);
  }
}

function openReviewModal(memberId, cycleNumber) {
  reviewTarget = { memberId, cycleNumber };
  rejectConfirming = false;
  render();
}

function closeReviewModal() {
  reviewTarget = null;
  rejectConfirming = false;
  render();
}

function confirmReview() {
  if (!reviewTarget) return;
  const { memberId, cycleNumber } = reviewTarget;
  applyStatus(memberId, cycleNumber, 2);
  logActivity(`Treasurer confirmed ${memberName(memberId)}'s cycle ${cycleNumber} as paid`);
  closeReviewModal();
}

function rejectReview() {
  rejectConfirming = true;
  render();
}

function cancelRejectConfirm() {
  rejectConfirming = false;
  render();
}

function doRejectReview() {
  if (!reviewTarget) return;
  const { memberId, cycleNumber } = reviewTarget;
  applyStatus(memberId, cycleNumber, 0);
  logActivity(`Treasurer rejected ${memberName(memberId)}'s cycle ${cycleNumber} claim`);
  closeReviewModal();
}

function moveMember(memberId, direction) {
  if (!unlocked) return;
  const sorted = [...state.members].sort((a, b) => a.order - b.order);
  const idx = sorted.findIndex(m => m.id === memberId);
  const swapIdx = idx + direction;
  if (swapIdx < 0 || swapIdx >= sorted.length) return;
  const otherName = sorted[swapIdx].name;
  const tmp = sorted[idx].order;
  sorted[idx].order = sorted[swapIdx].order;
  sorted[swapIdx].order = tmp;
  logActivity(`Payout order: ${memberName(memberId)} swapped positions with ${otherName}`);
  render();
}

function resetData() {
  resetConfirming = true;
  render();
}

function cancelResetConfirm() {
  resetConfirming = false;
  render();
}

function doReset() {
  state = defaultState();
  resetConfirming = false;
  logActivity('Fund was reset — all data cleared');
  render();
}

function csvEscape(value) {
  const s = String(value);
  if (/[",\r\n]/.test(s)) {
    return '"' + s.replace(/"/g, '""') + '"';
  }
  return s;
}

function exportData() {
  // Build a plain-text CSV summary (screenshots excluded — too large/binary for CSV)
  const sortedMembers = [...state.members].sort((a, b) => a.order - b.order);
  const rows = [['Cycle', 'Due Date', ...sortedMembers.map(m => m.name)]];
  for (let c = 1; c <= TOTAL_CYCLES; c++) {
    const row = [c, formatDate(cycleDueDate(c))];
    sortedMembers.forEach(m => {
      const s = getStatus(m.id, c);
      row.push(s === 2 ? 'Paid' : s === 1 ? 'Pending' : 'Unpaid');
    });
    rows.push(row);
  }
  const csv = rows.map(r => r.map(csvEscape).join(',')).join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'power-fund-summary.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function toggleUnlock() {
  if (unlocked) {
    unlocked = false;
    render();
    return;
  }
  pinInputValue = '';
  pinError = null;
  pinModalMode = state.treasurerPin ? 'enter' : 'setup';
  render();
}

function closePinModal() {
  pinModalMode = null;
  pinInputValue = '';
  pinError = null;
  render();
}

function submitPin() {
  if (pinModalMode === 'setup' || pinModalMode === 'change') {
    if (!pinInputValue || pinInputValue.length < 4) {
      pinError = 'PIN must be at least 4 digits.';
      render();
      return;
    }
    const wasChange = pinModalMode === 'change';
    state.treasurerPin = pinInputValue;
    logActivity(wasChange ? 'Treasurer PIN was changed' : 'Treasurer PIN was set for the first time');
    unlocked = true;
    closePinModal();
  } else {
    // enter mode
    if (pinInputValue === state.treasurerPin) {
      unlocked = true;
      closePinModal();
    } else {
      pinError = 'Incorrect PIN. Try again.';
      pinInputValue = '';
      render();
    }
  }
}

function openChangePin() {
  pinInputValue = '';
  pinError = null;
  pinModalMode = 'change';
  render();
}

function toggleRound(roundNum) {
  openRound = openRound === roundNum ? null : roundNum;
  render();
}

function getTotalCollected() {
  return Object.values(state.payments).filter(p => p.status === 2).length * CONTRIBUTION_PER_CYCLE;
}

function getPendingCount() {
  return Object.values(state.payments).filter(p => p.status === 1).length;
}

function roundCycleRange(round) {
  const startCycle = (round - 1) * CYCLES_PER_ROUND + 1;
  const endCycle = round * CYCLES_PER_ROUND;
  return { startCycle, endCycle };
}

function getRoundCollected(round) {
  const { startCycle, endCycle } = roundCycleRange(round);
  let n = 0;
  for (let c = startCycle; c <= endCycle; c++) {
    state.members.forEach(m => { if (getStatus(m.id, c) === 2) n++; });
  }
  return n * CONTRIBUTION_PER_CYCLE;
}

function getRoundPending(round) {
  const { startCycle, endCycle } = roundCycleRange(round);
  let n = 0;
  for (let c = startCycle; c <= endCycle; c++) {
    state.members.forEach(m => { if (getStatus(m.id, c) === 1) n++; });
  }
  return n;
}

function getMemberTotal(memberId) {
  let count = 0;
  for (let c = 1; c <= TOTAL_CYCLES; c++) {
    if (getStatus(memberId, c) === 2) count++;
  }
  return count * CONTRIBUTION_PER_CYCLE;
}

function isOverdueCell(memberId, cycleNumber) {
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  return getStatus(memberId, cycleNumber) === 0 && cycleDueDate(cycleNumber) < today;
}

function getMemberOverdueCount(memberId) {
  let count = 0;
  for (let c = 1; c <= TOTAL_CYCLES; c++) {
    if (isOverdueCell(memberId, c)) count++;
  }
  return count;
}

function getTotalOverdueCount() {
  return state.members.reduce((sum, m) => sum + getMemberOverdueCount(m.id), 0);
}

function getPayout(round) {
  return (state.payouts && state.payouts[round]) || { released: false, note: '', date: null };
}

function openPayoutModal(round) {
  payoutModalRound = round;
  payoutNoteValue = getPayout(round).note || '';
  render();
}

function closePayoutModal() {
  payoutModalRound = null;
  payoutNoteValue = '';
  render();
}

function markPayoutReleased() {
  if (!payoutModalRound) return;
  if (!state.payouts) state.payouts = {};
  const recipient = state.members.find(m => m.order === payoutModalRound);
  state.payouts[payoutModalRound] = {
    released: true,
    note: payoutNoteValue,
    date: formatDate(new Date())
  };
  logActivity(`Payout released — Round ${payoutModalRound} (${recipient ? recipient.name : '—'})${payoutNoteValue ? ': ' + payoutNoteValue : ''}`);
  closePayoutModal();
}

function unmarkPayoutReleased(round) {
  if (!state.payouts) state.payouts = {};
  delete state.payouts[round];
  const recipient = state.members.find(m => m.order === round);
  logActivity(`Payout release undone — Round ${round} (${recipient ? recipient.name : '—'})`);
  render();
}

function generateStatusText() {
  const sortedMembers = [...state.members].sort((a, b) => a.order - b.order);
  const curCycle = currentCycle();
  const round = Math.ceil(curCycle / CYCLES_PER_ROUND);
  const recipient = sortedMembers.find(m => m.order === round);
  const roundCollected = getRoundCollected(round);

  const paid = [], pending = [], unpaid = [];
  sortedMembers.forEach(m => {
    const status = getStatus(m.id, curCycle);
    if (status === 2) paid.push(m.name);
    else if (status === 1) pending.push(m.name);
    else unpaid.push(m.name);
  });

  let text = `⚡ Power Fund Update — ${formatDate(new Date())}\n`;
  text += `Round ${round} of ${TOTAL_ROUNDS} — ${recipient ? recipient.name : '—'}'s turn\n`;
  text += `Cycle due: ${formatDate(cycleDueDate(curCycle))}\n\n`;
  if (paid.length) text += `✅ Paid: ${paid.join(', ')}\n`;
  if (pending.length) text += `⏳ Pending review: ${pending.join(', ')}\n`;
  if (unpaid.length) text += `${isSameDay(cycleDueDate(curCycle), new Date()) || cycleDueDate(curCycle) < new Date() ? '⚠️' : '⏰'} Not yet paid: ${unpaid.join(', ')}\n`;
  text += `\nThis round: ₱${roundCollected.toLocaleString()} / ₱${GOAL_PER_PERSON.toLocaleString()}`;
  return text;
}

function openShareModal() {
  shareModalOpen = true;
  copyFeedback = null;
  render();
  const ta = document.getElementById('shareTextArea');
  if (ta) ta.select();
}

function closeShareModal() {
  shareModalOpen = false;
  copyFeedback = null;
  render();
}

function copyShareText() {
  const text = generateStatusText();
  const ta = document.getElementById('shareTextArea');
  if (ta) ta.select();
  try {
    navigator.clipboard.writeText(text).then(() => {
      copyFeedback = 'Copied!';
      render();
      const ta2 = document.getElementById('shareTextArea');
      if (ta2) ta2.select();
    }).catch(() => {
      copyFeedback = 'Could not auto-copy — text is selected, use Ctrl/Cmd+C';
      render();
    });
  } catch (e) {
    copyFeedback = 'Could not auto-copy — text is selected, use Ctrl/Cmd+C';
    render();
  }
}

function openEditNamesModal() {
  editNamesValues = {};
  state.members.forEach(m => { editNamesValues[m.id] = m.name; });
  editNamesError = null;
  editNamesModalOpen = true;
  render();
}

function closeEditNamesModal() {
  editNamesModalOpen = false;
  editNamesValues = {};
  editNamesError = null;
  render();
}

function saveEditNames() {
  const trimmed = {};
  for (const m of state.members) {
    const v = (editNamesValues[m.id] || '').trim();
    if (!v) {
      editNamesError = 'All names must be filled in.';
      render();
      return;
    }
    trimmed[m.id] = v;
  }
  const lowerNames = Object.values(trimmed).map(n => n.toLowerCase());
  if (new Set(lowerNames).size !== lowerNames.length) {
    editNamesError = 'Names must be unique.';
    render();
    return;
  }
  const changes = [];
  state.members.forEach(m => {
    if (m.name !== trimmed[m.id]) changes.push(`${m.name} → ${trimmed[m.id]}`);
    m.name = trimmed[m.id];
  });
  if (changes.length) logActivity(`Name(s) updated: ${changes.join(', ')}`);
  else saveState();
  closeEditNamesModal();
}

function currentCycle() {
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  for (let c = 1; c <= TOTAL_CYCLES; c++) {
    if (cycleDueDate(c) >= today) return c;
  }
  return TOTAL_CYCLES;
}

function isSameDay(d1, d2) {
  return d1.getFullYear() === d2.getFullYear() &&
         d1.getMonth() === d2.getMonth() &&
         d1.getDate() === d2.getDate();
}

function logActivity(text) {
  if (!state.activityLog) state.activityLog = [];
  state.activityLog.unshift({ ts: new Date().toISOString(), text });
  if (state.activityLog.length > 30) state.activityLog = state.activityLog.slice(0, 30);
  saveState();
}

function formatDateTime(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ' · ' +
         d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
}

function toggleActivityLog() {
  activityLogOpen = !activityLogOpen;
  render();
}

function memberName(id) {
  const m = state.members.find(x => x.id === id);
  return m ? m.name : id;
}

function render() {
  const app = document.getElementById('app');
  const sortedMembers = [...state.members].sort((a, b) => a.order - b.order);
  const curCycle = currentCycle();
  const curRound = Math.ceil(curCycle / CYCLES_PER_ROUND);
  const roundCollectedNow = getRoundCollected(curRound);
  const pct = Math.min(100, (roundCollectedNow / GOAL_PER_PERSON) * 100);
  if (!hasAutoOpened) {
    openRound = curRound;
    hasAutoOpened = true;
  }

  let html = '';

  html += `<div class="header">
    <div>
      <p class="title">⚡ Power Fund</p>
      <p class="subtitle">${sortedMembers.length}-member sinking fund · ₱${CONTRIBUTION_PER_CYCLE.toLocaleString()} on the 15th &amp; end of every month</p>
    </div>
    <button class="unlock-btn ${unlocked ? 'unlocked' : ''}" onclick="toggleUnlock()">
      ${unlocked ? '🔓 Treasurer mode on' : '🔒 Unlock treasurer mode'}
    </button>
  </div>`;

  html += (function() {
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const due = cycleDueDate(curCycle);
    const daysUntil = Math.round((due - today) / 86400000);
    let label, cls;
    if (daysUntil <= 0) { label = 'Due today'; cls = 'due-urgent'; }
    else if (daysUntil === 1) { label = 'Due tomorrow'; cls = 'due-urgent'; }
    else if (daysUntil <= 3) { label = `Due in ${daysUntil} days`; cls = 'due-soon'; }
    else { label = `Due in ${daysUntil} days`; cls = 'due-normal'; }
    return `<div class="due-countdown ${cls}">⏰ ${label} — ${formatDate(due)}</div>`;
  })();

  if (saveError) {
    html += `<div class="save-error-banner">⚠️ ${saveError}</div>`;
  }

  html += `<div class="battery-hero">
    <div class="battery-hero-top">
      <div class="battery-amount">₱${roundCollectedNow.toLocaleString()} <span>/ ₱${GOAL_PER_PERSON.toLocaleString()}</span></div>
      <div class="battery-meta">Round ${curRound} of ${TOTAL_ROUNDS}</div>
    </div>
    <div class="battery-shell"><div class="battery-fill" style="width:${pct}%"></div></div>
    <div class="cycle-note">₱${CONTRIBUTION_PER_CYCLE.toLocaleString()} per person via QR to treasurer${getPendingCount() ? ` · <b style="color:var(--accent)">${getPendingCount()} pending review</b>` : ''}${getTotalOverdueCount() ? ` · <b style="color:#E15353">${getTotalOverdueCount()} overdue</b>` : ''}</div>
    <button class="share-btn" onclick="openShareModal()">📋 Copy status update</button>
  </div>`;

  html += `<p class="section-label">Members</p><div class="member-grid">`;
  sortedMembers.forEach((m) => {
    const total = getMemberTotal(m.id);
    const payoutCycle = m.order * CYCLES_PER_ROUND;
    const payoutDate = formatDate(cycleDueDate(payoutCycle));
    const overdueCount = getMemberOverdueCount(m.id);
    html += `<div class="member-card">
      <div class="member-order-row">
        <span class="member-order-num">#${m.order} in order</span>
        ${unlocked ? `<div class="reorder-arrows">
          <button onclick="moveMember('${m.id}', -1)" ${m.order === 1 ? 'disabled' : ''}>↑</button>
          <button onclick="moveMember('${m.id}', 1)" ${m.order === sortedMembers.length ? 'disabled' : ''}>↓</button>
        </div>` : ''}
      </div>
      <p class="member-name">${m.name}</p>
      <div class="member-contrib-label">Contributed</div>
      <div class="member-contrib">₱${total.toLocaleString()}</div>
      <div class="member-payout-date">Payout target: ${payoutDate}</div>
      ${overdueCount ? `<div class="overdue-badge">⚠ ${overdueCount} overdue</div>` : ''}
    </div>`;
  });
  html += `</div>`;

  html += `<p class="section-label">Rounds &amp; cycles</p>`;
  for (let r = 1; r <= TOTAL_ROUNDS; r++) {
    const recipient = sortedMembers.find(m => m.order === r);
    const { startCycle, endCycle } = roundCycleRange(r);
    const roundCollected = getRoundCollected(r);
    const roundPending = getRoundPending(r);
    const isOpen = openRound === r;
    const payout = getPayout(r);
    const fullyFunded = roundCollected >= GOAL_PER_PERSON;
    html += `<div class="round">
      <div class="round-header" onclick="toggleRound(${r})">
        <div class="round-title"><span class="round-chevron ${isOpen ? 'open' : ''}">▸</span> Round ${r} — ${recipient ? recipient.name : '—'}${payout.released ? ' <span class="payout-done-tag">✅ Payout complete</span>' : ''}</div>
        <div class="round-status">₱${roundCollected.toLocaleString()} / ₱${GOAL_PER_PERSON.toLocaleString()}${roundPending ? ` · ${roundPending} pending` : ''} · ${formatDate(cycleDueDate(endCycle))}</div>
      </div>
      <div class="round-body ${isOpen ? 'open' : ''}">
        <div class="cycle-list">
          ${(function() {
            let rowsHtml = '';
            for (let c = startCycle; c <= endCycle; c++) {
              const rowTag = c === curCycle ? (isSameDay(cycleDueDate(c), new Date()) ? 'today' : 'next due') : null;
              const chips = sortedMembers.map(m => {
                const status = getStatus(m.id, c);
                const overdue = isOverdueCell(m.id, c);
                const cls = status === 2 ? 'paid' : status === 1 ? 'pending' : overdue ? 'overdue' : '';
                const icon = status === 2 ? '✓' : status === 1 ? '…' : overdue ? '!' : '';
                const clickable = unlocked || status === 0;
                const tip = status === 1 ? 'Pending treasurer review' : status === 2 ? 'Confirmed paid' : overdue ? 'Overdue — tap to contribute' : 'Tap to contribute';
                return `<span class="member-chip ${cls} ${clickable ? 'editable' : ''}" onclick="cellClicked('${m.id}', ${c})" title="${m.name}: ${tip}">${m.name}${icon ? ` ${icon}` : ''}</span>`;
              }).join('');
              rowsHtml += `<div class="cycle-row ${c === curCycle ? 'current-row' : ''}">
                <div class="cycle-date">${formatDate(cycleDueDate(c))}${rowTag ? ` <span class="today-tag">${rowTag}</span>` : ''}</div>
                <div class="cycle-chips">${chips}</div>
              </div>`;
            }
            return rowsHtml;
          })()}
        </div>
        ${payout.released
          ? `<div class="payout-status-box">
               <div>✅ Payout released ${payout.date ? `on ${payout.date}` : ''}${payout.note ? ` — ${payout.note}` : ''}</div>
               ${unlocked ? `<button class="reset-btn" onclick="unmarkPayoutReleased(${r})">Undo</button>` : ''}
             </div>`
          : unlocked && fullyFunded
            ? `<button class="contribute-btn payout-btn" onclick="openPayoutModal(${r})">Mark payout released</button>`
            : ''}
      </div>
    </div>`;
  }

  html += (function() {
    const log = state.activityLog || [];
    return `<div class="round activity-section">
      <div class="round-header" onclick="toggleActivityLog()">
        <div class="round-title"><span class="round-chevron ${activityLogOpen ? 'open' : ''}">▸</span> Activity log</div>
        <div class="round-status">${log.length} ${log.length === 1 ? 'entry' : 'entries'}</div>
      </div>
      <div class="round-body ${activityLogOpen ? 'open' : ''}">
        ${log.length === 0
          ? '<p class="activity-empty">No activity yet — actions will show up here as your group uses the tracker.</p>'
          : `<div class="activity-list">${log.map(e => `
              <div class="activity-item">
                <span class="activity-time">${formatDateTime(e.ts)}</span>
                <span class="activity-text">${e.text}</span>
              </div>`).join('')}</div>`}
      </div>
    </div>`;
  })();

  html += `<div class="footer-note">
    <b>How this works</b>
    <ul class="how-it-works-list">
      <li>Tap a cycle box → scan the QR → mark "I've sent this"</li>
      <li>Treasurer reviews the screenshot, then confirms or rejects</li>
      <li><span style="color:#E15353">Red</span> = overdue (still OK to pay late) · <span style="color:var(--accent)">Amber</span> = pending review</li>
      <li>Once a round hits ₱${GOAL_PER_PERSON.toLocaleString()}, the treasurer marks the payout released</li>
    </ul>
  </div>`;

  if (unlocked) {
    html += `<div class="reset-row">
      ${resetConfirming
        ? `<span class="reset-confirm-text">Reset everything?</span>
           <button class="reset-btn confirm-yes" onclick="doReset()">Yes, reset</button>
           <button class="reset-btn" onclick="cancelResetConfirm()">Cancel</button>`
        : `<button class="reset-btn" onclick="openEditNamesModal()">Edit names</button>
           <button class="reset-btn" onclick="exportData()">Export CSV</button>
           <button class="reset-btn" onclick="openChangePin()">Change PIN</button>
           <button class="reset-btn" onclick="resetData()">Reset all data</button>`}
    </div>`;
  }

  if (modalTarget) {
    const member = state.members.find(m => m.id === modalTarget.memberId);
    const dueDate = formatDate(cycleDueDate(modalTarget.cycleNumber));
    const maxCount = maxAdvanceCount(modalTarget.memberId, modalTarget.cycleNumber);
    const lastDueDate = formatDate(cycleDueDate(modalTarget.cycleNumber + modalCount - 1));
    const total = CONTRIBUTION_PER_CYCLE * modalCount;
    html += `<div class="modal-overlay" onclick="if(event.target===this) closeModal()">
      <div class="modal">
        <h3>Contribute — ${member ? member.name : ''}</h3>
        <p class="modal-sub">${modalCount === 1 ? `Cycle due ${dueDate}` : `Cycles ${dueDate} \u2013 ${lastDueDate}`}</p>
        <div class="qr-box">
          ${QR_IMAGE_URL ? `<img src="${QR_IMAGE_URL}" alt="Payment QR code">` : 'QR code goes here — treasurer needs to add the InstaPay/GCash QR image'}
        </div>
        ${QR_IMAGE_URL ? `<a href="${QR_IMAGE_URL}" download="powerfund-qr.jpg" class="download-qr-btn">⬇ Download QR to upload in your app</a>` : ''}
        <div class="modal-amount">₱${total.toLocaleString()}</div>
        ${maxCount > 1 ? `<div class="advance-row">
          <span class="advance-label">Paying in advance?</span>
          <div class="stepper">
            <button onclick="adjustModalCount(-1)" ${modalCount <= 1 ? 'disabled' : ''}>−</button>
            <span class="stepper-count">${modalCount} cycle${modalCount > 1 ? 's' : ''}</span>
            <button onclick="adjustModalCount(1)" ${modalCount >= maxCount ? 'disabled' : ''}>+</button>
          </div>
        </div>` : ''}
        <label class="proof-upload">
          ${modalProofDataUrl
            ? `<img src="${modalProofDataUrl}" class="proof-preview" alt="Payment screenshot">`
            : `<span class="proof-upload-label">📎 Attach payment screenshot (optional)</span>`}
          <input type="file" accept="image/*" onchange="onProofSelected(this)" hidden>
        </label>
        <div class="modal-actions">
          <button class="modal-btn-primary" onclick="markPending()">I've sent this</button>
          <button class="modal-btn-secondary" onclick="closeModal()">Cancel</button>
        </div>
      </div>
    </div>`;
  }

  if (reviewTarget) {
    const member = state.members.find(m => m.id === reviewTarget.memberId);
    const dueDate = formatDate(cycleDueDate(reviewTarget.cycleNumber));
    const proof = getProof(reviewTarget.memberId, reviewTarget.cycleNumber);
    html += `<div class="modal-overlay" onclick="if(event.target===this) closeReviewModal()">
      <div class="modal">
        <h3>Review payment — ${member ? member.name : ''}</h3>
        <p class="modal-sub">Cycle due ${dueDate} · ₱${CONTRIBUTION_PER_CYCLE.toLocaleString()}</p>
        <div class="qr-box">
          ${proof ? `<img src="${proof}" alt="Submitted payment screenshot">` : 'No screenshot attached — member confirmed by text only'}
        </div>
        <div class="modal-meta">Check the screenshot matches ₱${CONTRIBUTION_PER_CYCLE.toLocaleString()} sent to the right account before confirming.</div>
        <div class="modal-actions">
          ${rejectConfirming
            ? `<p class="reject-confirm-text">Reject this claim? It goes back to unpaid and the screenshot is removed.</p>
               <button class="modal-btn-primary confirm-yes" onclick="doRejectReview()">Yes, reject</button>
               <button class="modal-btn-secondary" onclick="cancelRejectConfirm()">Never mind</button>`
            : `<button class="modal-btn-primary" onclick="confirmReview()">Confirm as paid</button>
               <button class="modal-btn-secondary reject" onclick="rejectReview()">Reject</button>
               <button class="modal-btn-secondary" onclick="closeReviewModal()">Cancel</button>`}
        </div>
      </div>
    </div>`;
  }

  if (pinModalMode) {
    const titles = { setup: 'Create a treasurer PIN', enter: 'Enter treasurer PIN', change: 'Change treasurer PIN' };
    const subs = {
      setup: 'This protects treasurer actions. Anyone with the PIN can edit — share it only with whoever holds that role.',
      enter: 'Enter the PIN to unlock treasurer actions.',
      change: 'Set a new PIN. This replaces the current one for everyone.'
    };
    html += `<div class="modal-overlay" onclick="if(event.target===this) closePinModal()">
      <div class="modal">
        <h3>${titles[pinModalMode]}</h3>
        <p class="modal-sub">${subs[pinModalMode]}</p>
        <input type="password" inputmode="numeric" class="pin-input" placeholder="PIN" value="${pinInputValue}"
               oninput="pinInputValue=this.value" onkeydown="if(event.key==='Enter') submitPin()">
        ${pinError ? `<p class="pin-error">${pinError}</p>` : ''}
        <div class="modal-actions">
          <button class="modal-btn-primary" onclick="submitPin()">${pinModalMode === 'enter' ? 'Unlock' : 'Save PIN'}</button>
          <button class="modal-btn-secondary" onclick="closePinModal()">Cancel</button>
        </div>
      </div>
    </div>`;
  }

  if (payoutModalRound) {
    const recipient = sortedMembers.find(m => m.order === payoutModalRound);
    html += `<div class="modal-overlay" onclick="if(event.target===this) closePayoutModal()">
      <div class="modal">
        <h3>Mark payout released</h3>
        <p class="modal-sub">Round ${payoutModalRound} — ${recipient ? recipient.name : ''} · ₱${GOAL_PER_PERSON.toLocaleString()}</p>
        <textarea class="payout-note-input" placeholder="Optional: what did they buy? (e.g. BLUETTI AC70P, ₱32,000)"
                  oninput="payoutNoteValue=this.value">${payoutNoteValue}</textarea>
        <div class="modal-actions">
          <button class="modal-btn-primary" onclick="markPayoutReleased()">Confirm released</button>
          <button class="modal-btn-secondary" onclick="closePayoutModal()">Cancel</button>
        </div>
      </div>
    </div>`;
  }

  if (shareModalOpen) {
    html += `<div class="modal-overlay" onclick="if(event.target===this) closeShareModal()">
      <div class="modal">
        <h3>Status update</h3>
        <p class="modal-sub">Copy this and paste it into your group chat</p>
        <textarea id="shareTextArea" class="share-text-area" readonly>${generateStatusText()}</textarea>
        ${copyFeedback ? `<p class="copy-feedback">${copyFeedback}</p>` : ''}
        <div class="modal-actions">
          <button class="modal-btn-primary" onclick="copyShareText()">Copy</button>
          <button class="modal-btn-secondary" onclick="closeShareModal()">Close</button>
        </div>
      </div>
    </div>`;
  }

  if (editNamesModalOpen) {
    const orderedForEdit = [...state.members].sort((a, b) => a.order - b.order);
    html += `<div class="modal-overlay" onclick="if(event.target===this) closeEditNamesModal()">
      <div class="modal edit-names-modal">
        <h3>Edit member names</h3>
        <p class="modal-sub">Updates apply everywhere — payment history stays linked to each person.</p>
        ${orderedForEdit.map(m => `
          <input type="text" class="pin-input name-input" value="${(editNamesValues[m.id] || '').replace(/"/g, '&quot;')}"
                 oninput="editNamesValues['${m.id}']=this.value" placeholder="Name">
        `).join('')}
        ${editNamesError ? `<p class="pin-error">${editNamesError}</p>` : ''}
        <div class="modal-actions">
          <button class="modal-btn-primary" onclick="saveEditNames()">Save names</button>
          <button class="modal-btn-secondary" onclick="closeEditNamesModal()">Cancel</button>
        </div>
      </div>
    </div>`;
  }

  app.innerHTML = html;
}

loadState();

function isAnyModalOpen() {
  return !!(modalTarget || reviewTarget || pinModalMode || payoutModalRound || shareModalOpen || editNamesModalOpen);
}

// Shared storage doesn't push live updates to other open sessions, so poll
// periodically and refresh when the tab regains focus — skip refreshing
// while a modal is open so we don't interrupt someone mid-action.
setInterval(() => {
  if (!isAnyModalOpen()) loadState();
}, 8000);

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && !isAnyModalOpen()) {
    loadState();
  }
});
</script>
</body>
</html>
