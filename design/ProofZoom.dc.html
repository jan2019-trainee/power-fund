<!doctype html>
<html>

    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: #F5A623; }

  <div style="position:absolute; inset:0; background:rgba(5,10,18,0.94); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:24px; padding:24px;">
    <div style="width:100%; max-width:320px; border-radius:20px; overflow:hidden; background:linear-gradient(160deg, #EAF3EE, #D8E9E0); padding:40px 20px;">

        <div style="width:64px; height:64px; border-radius:50%; background:rgba(76,175,131,0.16); display:flex; align-items:center; justify-content:center;">
          <svg class="icon" viewBox="0 0 24 24" style="width:32px; height:32px; color:#2E8B5C; stroke-width:2.6;"><polyline points="4 12 10 18 20 6"/></svg>
        </div>
        <div style="font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:18px; color:#14213D;">Payment Successful</div>

      </div>
    </div>

      <svg class="icon" viewBox="0 0 24 24" style="width:14px; height:14px;"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
