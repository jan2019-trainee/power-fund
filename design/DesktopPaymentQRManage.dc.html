<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    .icon { display: block; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .pf-modal { opacity: 0; animation: pfModalIn .32s cubic-bezier(.22,1,.36,1) both; }
    @keyframes pfModalIn { from { opacity: 0; transform: translate(-50%,-50%) translateY(10px) scale(0.98); } to { opacity: 1; transform: translate(-50%,-50%) translateY(0) scale(1); } }
    .pf-x:hover { background: rgba(255,255,255,0.08) !important; }
    .pf-row:hover { background: rgba(255,255,255,0.06) !important; }
    .pf-cta:active { transform: scale(0.98); }
  </style>
</helmet>

<div style="position:relative; width:1440px; height:900px; overflow:hidden; background:#0D1B2A; border-radius:16px; border:1px solid rgba(255,255,255,0.08); font-family:'Inter',sans-serif; color:#EDEFF2;">

  <div style="opacity:0.35; filter:blur(1.5px); display:flex; height:100%;">
    <div style="width:240px; height:100%; background:rgba(255,255,255,0.02); border-right:1px solid rgba(255,255,255,0.08);"></div>
    <div style="flex:1; padding:32px 40px;"><div style="font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:24px;">Menu</div></div>
  </div>
  <div style="position:absolute; inset:0; background:rgba(5,10,18,0.6);"></div>

  <div class="pf-modal" style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:520px; background:linear-gradient(180deg, rgba(20,42,66,0.98), rgba(13,27,42,0.99)); border:1px solid rgba(255,255,255,0.12); border-radius:22px; box-shadow:0 30px 80px -20px rgba(0,0,0,0.7); padding:30px 32px;">

    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:20px;">
      <div style="display:flex; align-items:center; gap:10px;">
        <div style="width:36px; height:36px; border-radius:10px; background:#fff; display:flex; align-items:center; justify-content:center; flex-shrink:0; padding:5px;">
          <svg viewBox="0 0 24 24" style="width:100%; height:100%;"><rect x="3" y="3" width="7" height="7" fill="#0D1B2A"/><rect x="14" y="3" width="7" height="7" fill="none" stroke="#0D1B2A" stroke-width="1.5"/><rect x="3" y="14" width="7" height="7" fill="none" stroke="#0D1B2A" stroke-width="1.5"/><rect x="15" y="15" width="5" height="5" fill="#0D1B2A"/></svg>
        </div>
        <div>
          <div style="font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:17px;">Payment QR code</div>
          <div style="font-size:11.5px; color:#93A2B8;">Shown to members on Contribute</div>
        </div>
      </div>
      <button class="pf-x" style="width:32px; height:32px; border-radius:9px; background:none; border:none; display:flex; align-items:center; justify-content:center; cursor:pointer;">
        <svg class="icon" viewBox="0 0 24 24" style="width:16px; height:16px; color:#93A2B8;"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <div style="display:flex; flex-direction:column; align-items:center; padding:20px; border-radius:18px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.1); margin-bottom:16px;">
      <div style="width:150px; height:150px; border-radius:14px; background:#fff; padding:10px; margin-bottom:10px;">
        <svg viewBox="0 0 100 100" style="width:100%; height:100%;">
          <rect x="0" y="0" width="28" height="28" fill="#0D1B2A"/><rect x="6" y="6" width="16" height="16" fill="#fff"/><rect x="10" y="10" width="8" height="8" fill="#0D1B2A"/>
          <rect x="72" y="0" width="28" height="28" fill="#0D1B2A"/><rect x="78" y="6" width="16" height="16" fill="#fff"/><rect x="82" y="10" width="8" height="8" fill="#0D1B2A"/>
          <rect x="0" y="72" width="28" height="28" fill="#0D1B2A"/><rect x="6" y="78" width="16" height="16" fill="#fff"/><rect x="10" y="82" width="8" height="8" fill="#0D1B2A"/>
          <rect x="40" y="10" width="6" height="6" fill="#0D1B2A"/><rect x="52" y="10" width="6" height="6" fill="#0D1B2A"/><rect x="34" y="24" width="6" height="6" fill="#0D1B2A"/>
          <rect x="46" y="34" width="6" height="6" fill="#0D1B2A"/><rect x="58" y="40" width="6" height="6" fill="#0D1B2A"/><rect x="34" y="46" width="6" height="6" fill="#0D1B2A"/>
          <rect x="70" y="46" width="6" height="6" fill="#0D1B2A"/><rect x="46" y="58" width="6" height="6" fill="#0D1B2A"/><rect x="60" y="60" width="6" height="6" fill="#0D1B2A"/>
          <rect x="34" y="66" width="6" height="6" fill="#0D1B2A"/><rect x="46" y="76" width="6" height="6" fill="#0D1B2A"/><rect x="58" y="82" width="6" height="6" fill="#0D1B2A"/>
          <rect x="70" y="70" width="18" height="18" fill="#0D1B2A"/>
        </svg>
      </div>
      <div style="font-size:13px; font-weight:600;">GCash &middot; 09XX XXX XXXX</div>
      <div style="font-size:11.5px; color:#93A2B8; margin-top:2px;">Added Aug 12, 2026</div>
    </div>

    <div style="display:flex; gap:10px; margin-bottom:16px;">
      <button class="pf-row" style="flex:1; display:flex; align-items:center; gap:10px; padding:13px; border-radius:14px; background:rgba(20,42,66,0.5); border:1px solid rgba(255,255,255,0.1); cursor:pointer; text-align:left;">
        <svg class="icon" viewBox="0 0 24 24" style="width:16px; height:16px; color:#4CD9C0; flex-shrink:0;"><path d="M12 3v12"/><polyline points="7 8 12 3 17 8"/><path d="M5 15v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4"/></svg>
        <span style="font-size:12.5px; font-weight:500; color:#EDEFF2;">Upload from Computer</span>
      </button>
      <button class="pf-row" style="flex:1; display:flex; align-items:center; gap:10px; padding:13px; border-radius:14px; background:rgba(20,42,66,0.5); border:1px solid rgba(255,255,255,0.1); cursor:pointer; text-align:left;">
        <svg class="icon" viewBox="0 0 24 24" style="width:16px; height:16px; color:#F5A623; flex-shrink:0;"><path d="M4 8h3l1.6-2.4A2 2 0 0 1 10.3 4.6h3.4a2 2 0 0 1 1.7 1L17 8h3a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-9a2 2 0 0 1 2-2Z"/><circle cx="12" cy="14" r="3.6"/></svg>
        <span style="font-size:12.5px; font-weight:500; color:#EDEFF2;">Use Webcam</span>
      </button>
    </div>

    <div style="display:flex; gap:10px; margin-bottom:12px;">
      <div style="flex:1;">
        <label style="font-size:11px; color:#93A2B8; text-transform:uppercase; letter-spacing:.05em; display:block; margin-bottom:6px;">Bank / E-wallet</label>
        <select style="width:100%; height:46px; border-radius:12px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.14); color:#EDEFF2; font-family:'Inter',sans-serif; font-size:13.5px; padding:0 14px;">
          <option>GCash</option>
          <option>Maya</option>
          <option>BPI</option>
          <option>BDO</option>
          <option>Metrobank</option>
          <option>Other</option>
        </select>
      </div>
      <div style="flex:1;">
        <label style="font-size:11px; color:#93A2B8; text-transform:uppercase; letter-spacing:.05em; display:block; margin-bottom:6px;">Account number</label>
        <input type="text" value="09XX XXX XXXX" style="width:100%; height:46px; border-radius:12px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.14); color:#EDEFF2; font-family:'Inter',sans-serif; font-size:13.5px; padding:0 14px;">
      </div>
    </div>

    <label style="font-size:11px; color:#93A2B8; text-transform:uppercase; letter-spacing:.05em; display:block; margin-bottom:6px;">Account name</label>
    <input type="text" placeholder="e.g. Cathy Reyes" style="width:100%; height:46px; border-radius:12px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.14); color:#EDEFF2; font-family:'Inter',sans-serif; font-size:13.5px; padding:0 14px; margin-bottom:20px;">

    <button id="pf-qr-save" class="pf-cta" style="width:100%; height:50px; border:none; border-radius:15px; background:linear-gradient(135deg,#F5A623,#e0951d); color:#14213D; font-family:'Inter',sans-serif; font-weight:700; font-size:14px; cursor:pointer;">Save Payment QR</button>
  </div>

</div>
</x-dc>
<script data-dc-script>
class Component extends DCLogic {
  componentDidMount() {
    var save = document.getElementById('pf-qr-save');
    if (save) save.addEventListener('click', function () {
      save.textContent = 'Saved';
      save.disabled = true;
      save.style.opacity = '0.75';
    });
  }
}
</script>
</body>
</html>
