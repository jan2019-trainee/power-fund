<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    .icon { display: block; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .pf-modal { opacity: 0; animation: pfModalIn .32s cubic-bezier(.22,1,.36,1) both; }
    @keyframes pfModalIn { from { opacity: 0; transform: translate(-50%,-50%) translateY(10px) scale(0.98); } to { opacity: 1; transform: translate(-50%,-50%) translateY(0) scale(1); } }
    .pf-x:hover { background: rgba(255,255,255,0.08) !important; }
    input { font-family:'Inter',sans-serif; }
  </style>
</helmet>

<div style="position:relative; width:1440px; height:900px; overflow:hidden; background:#0D1B2A; border-radius:16px; border:1px solid rgba(255,255,255,0.08); font-family:'Inter',sans-serif; color:#EDEFF2;">

  <div style="opacity:0.35; filter:blur(1.5px); display:flex; height:100%;">
    <div style="width:240px; height:100%; background:rgba(255,255,255,0.02); border-right:1px solid rgba(255,255,255,0.08);"></div>
    <div style="flex:1; padding:32px 40px;"><div style="font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:24px;">Menu</div></div>
  </div>
  <div style="position:absolute; inset:0; background:rgba(5,10,18,0.6);"></div>

  <div class="pf-modal" style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:460px; background:linear-gradient(180deg, rgba(20,42,66,0.98), rgba(13,27,42,0.99)); border:1px solid rgba(225,83,83,0.3); border-radius:22px; box-shadow:0 30px 80px -20px rgba(0,0,0,0.7); padding:28px 30px;">

    <div style="display:flex; align-items:center; gap:10px; margin-bottom:16px;">
      <div style="width:38px; height:38px; border-radius:11px; background:rgba(225,83,83,0.14); display:flex; align-items:center; justify-content:center; flex-shrink:0;">
        <svg class="icon" viewBox="0 0 24 24" style="width:19px; height:19px; color:#E15353;"><path d="M10.3 4.6 2.6 18a2 2 0 0 0 1.7 3h15.4a2 2 0 0 0 1.7-3L13.7 4.6a2 2 0 0 0-3.4 0Z"/><path d="M12 9.5v4"/><circle cx="12" cy="17" r=".9" fill="currentColor" stroke="none"/></svg>
      </div>
      <div style="font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:18px;">Reset all fund data</div>
    </div>

    <div style="font-size:13px; line-height:1.6; color:#93A2B8; margin-bottom:22px;">
      This permanently deletes every round, contribution, and payout record. Members and their names are kept. This cannot be undone.
    </div>

    <label style="font-size:11px; color:#93A2B8; text-transform:uppercase; letter-spacing:.05em; display:block; margin-bottom:6px;">Type RESET to confirm</label>
    <input id="pf-reset-type" type="text" placeholder="RESET" style="width:100%; height:46px; border-radius:12px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.14); color:#EDEFF2; font-size:14px; padding:0 14px; margin-bottom:14px;">

    <label style="font-size:11px; color:#93A2B8; text-transform:uppercase; letter-spacing:.05em; display:block; margin-bottom:6px;">Enter your PIN</label>
    <input id="pf-reset-pin" type="password" placeholder="&bull;&bull;&bull;&bull;" style="width:100%; height:46px; border-radius:12px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.14); color:#EDEFF2; font-size:14px; padding:0 14px; margin-bottom:22px;">

    <div style="display:flex; gap:10px;">
      <button style="flex:1; height:48px; border-radius:14px; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.14); color:#EDEFF2; font-family:'Inter',sans-serif; font-weight:600; font-size:13.5px; cursor:pointer;">Cancel</button>
      <button id="pf-reset-btn" disabled style="flex:1; height:48px; border-radius:14px; background:#E15353; border:none; color:#fff; font-family:'Inter',sans-serif; font-weight:700; font-size:13.5px; cursor:pointer; opacity:0.4;">Reset everything</button>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script>
class Component extends DCLogic {
  componentDidMount() {
    var typeInput = document.getElementById('pf-reset-type');
    var pinInput = document.getElementById('pf-reset-pin');
    var btn = document.getElementById('pf-reset-btn');
    function check() {
      var ok = typeInput.value.trim().toUpperCase() === 'RESET' && pinInput.value.length >= 4;
      btn.disabled = !ok;
      btn.style.opacity = ok ? '1' : '0.4';
    }
    if (typeInput) typeInput.addEventListener('input', check);
    if (pinInput) pinInput.addEventListener('input', check);
  }
}
</script>
</body>
</html>
