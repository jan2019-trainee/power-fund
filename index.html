<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0D1B2A">
  <title>Power Fund Tracker</title>

  <!-- PWA -->
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Power Fund">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="wrap" id="app">
    <div class="loading"><div class="loading-spinner" aria-hidden="true"></div><p>Loading fund data…</p></div>
  </div>

  <!-- Supabase client (UMD build exposes window.supabase). Vendored locally so
       the app shell has no runtime CDN dependency and works offline. -->
  <script src="js/vendor/supabase-2.45.4.min.js"></script>

  <!-- App code: config -> calculations -> database -> views -> app -> pwa.
       Views register themselves on window.PFViews and are called by render(),
       so they must load before app.js. -->
  <script src="js/config.js"></script>
  <script src="js/calculations.js"></script>
  <script src="js/database.js"></script>
  <script src="js/views/home.js"></script>
  <script src="js/views/rounds.js"></script>
  <script src="js/views/members.js"></script>
  <script src="js/views/menu.js"></script>
  <script src="js/app.js"></script>
  <script src="js/pwa.js"></script>
</body>
</html>
