<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: #F5A623; }
    a:hover { color: #ffb733; }
    .icon { display: block; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .pf-fade { opacity: 0; animation: pfFadeUp .4s cubic-bezier(.22,1,.36,1) both; }
    @keyframes pfFadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pfSheetUp { from { opacity: 0; transform: translateY(28px); } to { opacity: 1; transform: translateY(0); } }
    .pf-sheet { animation: pfSheetUp .38s cubic-bezier(.22,1,.36,1) both; }
    .pf-chip:active { transform: scale(0.95); }
    .pf-cta-danger:active { transform: scale(0.97); }
  </style>
</helmet>

<div style="position:relative; width:390px; height:600px; overflow:hidden; background:#0D1B2A; border-radius:38px; border:1px solid rgba(255,255,255,0.08); font-family:'Inter',sans-serif; color:#EDEFF2;">

  <div class="pf-fade" style="padding:28px 20px 0; opacity:0.28; filter:blur(1.5px); animation-delay:0s;">
    <div style="font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:20px;">Rounds</div>
  </div>
  <div style="position:absolute; inset:0; background:rgba(5,10,18,0.6);"></div>

  <div class="pf-sheet" style="position:absolute; left:0; right:0; bottom:0; background:linear-gradient(180deg, rgba(20,42,66,0.97), rgba(13,27,42,0.99)); border-top:1px solid rgba(225,83,83,0.3); border-radius:26px 26px 0 0; box-shadow:0 -20px 50px -20px rgba(0,0,0,0.7); padding:12px 22px calc(22px + env(safe-area-inset-bottom, 0px));">

    <div style="width:36px; height:4px; border-radius:3px; background:rgba(255,255,255,0.18); margin:0 auto 18px;"></div>

    <div style="display:flex; align-items:center; gap:10px; margin-bottom:16px;">
      <div style="width:36px; height:36px; border-radius:10px; background:rgba(225,83,83,0.14); display:flex; align-items:center; justify-content:center; flex-shrink:0;">
        <svg class="icon" viewBox="0 0 24 24" style="width:18px; height:18px; color:#E15353;"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-2"/></svg>
      </div>
      <div style="font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:17px;">Undo payout release?</div>
    </div>

    <div style="font-size:13px; line-height:1.6; color:#93A2B8; margin-bottom:22px;">
      Round 1 returns to <b style="color:#F5A623;">Payout Pending</b>. The recorded release date, note, amount and recipient are cleared &mdash; Ana's ₱30,000 stays on record as owed, not paid.
    </div>

    <button id="pf-undo-yes" class="pf-cta-danger" style="width:100%; height:52px; border:none; border-radius:16px; background:#E15353; color:#fff; font-family:'Inter',sans-serif; font-weight:700; font-size:14.5px; cursor:pointer; margin-bottom:10px;">Yes, Undo Release</button>
    <button class="pf-chip" style="width:100%; text-align:center; background:none; border:none; color:#93A2B8; font-family:'Inter',sans-serif; font-size:13px; font-weight:600; cursor:pointer; padding:10px 0 2px;">Cancel</button>
  </div>

</div>
</x-dc>
<script data-dc-script>
class Component extends DCLogic {
  componentDidMount() {
    var yes = document.getElementById('pf-undo-yes');
    if (yes) yes.addEventListener('click', function () {
      yes.textContent = 'Release undone';
      yes.disabled = true;
      yes.style.opacity = '0.7';
    });
  }
}
</script>
</body>
</html>
