<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: #F5A623; }
    a:hover { color: #ffb733; }
    .icon { display: block; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .pf-fade { opacity: 0; animation: pfFadeUp .4s cubic-bezier(.22,1,.36,1) both; }
    @keyframes pfFadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pfSheetUp { from { opacity: 0; transform: translateY(28px); } to { opacity: 1; transform: translateY(0); } }
    .pf-sheet { animation: pfSheetUp .38s cubic-bezier(.22,1,.36,1) both; }
    @keyframes pfDotPop { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .pf-chip:active { transform: scale(0.95); }
    .pf-key:active { transform: scale(0.94); background: rgba(255,255,255,0.1) !important; }
    @media (prefers-reduced-motion: reduce) {
      .pf-fade, .pf-sheet { animation: none; opacity: 1; }
    }
  </style>
</helmet>

<div style="position:relative; width:390px; height:760px; overflow:hidden; background:#0D1B2A; border-radius:38px; border:1px solid rgba(255,255,255,0.08); font-family:'Inter',sans-serif; color:#EDEFF2;">

  <!-- dimmed backdrop hint -->
  <div class="pf-fade" style="padding:28px 20px 0; opacity:0.28; filter:blur(1.5px); animation-delay:0s;">
    <div style="font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:20px;">Power Fund</div>
  </div>
  <div style="position:absolute; inset:0; background:rgba(5,10,18,0.6);"></div>

  <!-- bottom sheet -->
  <div class="pf-sheet" style="position:absolute; left:0; right:0; bottom:0; background:linear-gradient(180deg, rgba(20,42,66,0.97), rgba(13,27,42,0.99)); border-top:1px solid rgba(255,255,255,0.14); border-radius:26px 26px 0 0; box-shadow:0 -20px 50px -20px rgba(0,0,0,0.7); padding:12px 26px calc(24px + env(safe-area-inset-bottom, 0px));">

    <div style="width:36px; height:4px; border-radius:3px; background:rgba(255,255,255,0.18); margin:0 auto 18px;"></div>

    <div style="display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:20px;">
      <div>
        <div style="font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:19px;">Enter PIN</div>
        <div style="font-size:12.5px; color:#93A2B8; margin-top:2px;">Unlock treasurer tools</div>
      </div>
      <button class="pf-chip" style="width:32px; height:32px; border-radius:50%; background:rgba(255,255,255,0.08); border:none; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;">
        <svg class="icon" viewBox="0 0 24 24" style="width:15px; height:15px; color:#EDEFF2;"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
      </button>
    </div>

    <!-- lock badge -->
    <div style="display:flex; justify-content:center; margin-bottom:22px;">
      <div style="width:64px; height:64px; border-radius:50%; background:linear-gradient(160deg, rgba(245,166,35,0.2), rgba(76,217,192,0.12)); border:1px solid rgba(255,255,255,0.14); display:flex; align-items:center; justify-content:center;">
        <svg class="icon" viewBox="0 0 24 24" style="width:26px; height:26px; color:#F5A623; stroke-width:1.7;">
          <rect x="5" y="11" width="14" height="10" rx="2"/>
          <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
        </svg>
      </div>
    </div>

    <!-- PIN dots: 4-digit entry, 3 filled — mid-entry demo state -->
    <div style="display:flex; justify-content:center; gap:16px; margin-bottom:28px;">
      <span style="width:16px; height:16px; border-radius:50%; background:#F5A623; animation:pfDotPop .2s ease both;"></span>
      <span style="width:16px; height:16px; border-radius:50%; background:#F5A623; animation:pfDotPop .2s ease .05s both;"></span>
      <span style="width:16px; height:16px; border-radius:50%; background:#F5A623; animation:pfDotPop .2s ease .1s both;"></span>
      <span style="width:16px; height:16px; border-radius:50%; border:1.5px solid rgba(255,255,255,0.25); background:none;"></span>
    </div>

    <!-- numeric keypad -->
    <div style="display:grid; grid-template-columns:repeat(3, 1fr); gap:14px; max-width:280px; margin:0 auto;">
      <button class="pf-key" style="height:60px; border-radius:16px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.08); color:#EDEFF2; font-family:'Space Grotesk',sans-serif; font-size:20px; font-weight:600; cursor:pointer; transition:transform .1s ease;">1</button>
      <button class="pf-key" style="height:60px; border-radius:16px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.08); color:#EDEFF2; font-family:'Space Grotesk',sans-serif; font-size:20px; font-weight:600; cursor:pointer; transition:transform .1s ease;">2</button>
      <button class="pf-key" style="height:60px; border-radius:16px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.08); color:#EDEFF2; font-family:'Space Grotesk',sans-serif; font-size:20px; font-weight:600; cursor:pointer; transition:transform .1s ease;">3</button>
      <button class="pf-key" style="height:60px; border-radius:16px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.08); color:#EDEFF2; font-family:'Space Grotesk',sans-serif; font-size:20px; font-weight:600; cursor:pointer; transition:transform .1s ease;">4</button>
      <button class="pf-key" style="height:60px; border-radius:16px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.08); color:#EDEFF2; font-family:'Space Grotesk',sans-serif; font-size:20px; font-weight:600; cursor:pointer; transition:transform .1s ease;">5</button>
      <button class="pf-key" style="height:60px; border-radius:16px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.08); color:#EDEFF2; font-family:'Space Grotesk',sans-serif; font-size:20px; font-weight:600; cursor:pointer; transition:transform .1s ease;">6</button>
      <button class="pf-key" style="height:60px; border-radius:16px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.08); color:#EDEFF2; font-family:'Space Grotesk',sans-serif; font-size:20px; font-weight:600; cursor:pointer; transition:transform .1s ease;">7</button>
      <button class="pf-key" style="height:60px; border-radius:16px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.08); color:#EDEFF2; font-family:'Space Grotesk',sans-serif; font-size:20px; font-weight:600; cursor:pointer; transition:transform .1s ease;">8</button>
      <button class="pf-key" style="height:60px; border-radius:16px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.08); color:#EDEFF2; font-family:'Space Grotesk',sans-serif; font-size:20px; font-weight:600; cursor:pointer; transition:transform .1s ease;">9</button>
      <span></span>
      <button class="pf-key" style="height:60px; border-radius:16px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.08); color:#EDEFF2; font-family:'Space Grotesk',sans-serif; font-size:20px; font-weight:600; cursor:pointer; transition:transform .1s ease;">0</button>
      <button class="pf-key" style="height:60px; border-radius:16px; background:none; border:none; color:#93A2B8; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:transform .1s ease;">
        <svg class="icon" viewBox="0 0 24 24" style="width:22px; height:22px;"><path d="M21 4H8l-6 8 6 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2Z"/><line x1="18" y1="9" x2="12" y2="15"/><line x1="12" y1="9" x2="18" y2="15"/></svg>
      </button>
    </div>

    <div style="text-align:center; margin-top:22px;">
      <a href="#" style="font-size:12px; font-weight:600; text-decoration:underline;">Forgot PIN?</a>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
