<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: #F5A623; }
    a:hover { color: #ffb733; }
    .icon { display: block; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .pf-fade { opacity: 0; animation: pfFadeUp .4s cubic-bezier(.22,1,.36,1) both; }
    @keyframes pfFadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pfSheetUp { from { opacity: 0; transform: translateY(28px); } to { opacity: 1; transform: translateY(0); } }
    .pf-sheet { animation: pfSheetUp .38s cubic-bezier(.22,1,.36,1) both; }
    @keyframes pfShake {
      10%, 90% { transform: translateX(-1px); }
      20%, 80% { transform: translateX(2px); }
      30%, 50%, 70% { transform: translateX(-4px); }
      40%, 60% { transform: translateX(4px); }
    }
    .pf-cta:active { transform: scale(0.97); }
    .pf-chip:active { transform: scale(0.95); }
    @media (prefers-reduced-motion: reduce) {
      .pf-fade, .pf-sheet { animation: none; opacity: 1; }
    }
  </style>
</helmet>

<div style="position:relative; width:390px; height:900px; overflow:hidden; background:#0D1B2A; border-radius:38px; border:1px solid rgba(255,255,255,0.08); font-family:'Inter',sans-serif; color:#EDEFF2;">

  <!-- dimmed backdrop hint -->
  <div class="pf-fade" style="padding:28px 20px 0; opacity:0.28; filter:blur(1.5px); animation-delay:0s;">
    <div style="font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:20px; margin-bottom:14px;">Power Fund</div>
    <div style="height:80px; border-radius:16px; background:rgba(27,58,87,0.6); border:1px solid rgba(245,166,35,0.3);"></div>
  </div>
  <div style="position:absolute; inset:0; background:rgba(5,10,18,0.55);"></div>

  <!-- bottom sheet -->
  <div class="pf-sheet" style="position:absolute; left:0; right:0; bottom:0; max-height:90%; overflow-y:auto; background:linear-gradient(180deg, rgba(20,42,66,0.97), rgba(13,27,42,0.99)); border-top:1px solid rgba(255,255,255,0.14); border-radius:26px 26px 0 0; box-shadow:0 -20px 50px -20px rgba(0,0,0,0.7); padding:12px 22px calc(22px + env(safe-area-inset-bottom, 0px));">

    <div style="width:36px; height:4px; border-radius:3px; background:rgba(255,255,255,0.18); margin:0 auto 16px;"></div>

    <div style="display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:18px;">
      <div style="font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:19px;">Review Payment</div>
      <button class="pf-chip" style="width:32px; height:32px; border-radius:50%; background:rgba(255,255,255,0.08); border:none; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;">
        <svg class="icon" viewBox="0 0 24 24" style="width:15px; height:15px; color:#EDEFF2;"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
      </button>
    </div>

    <!-- claimant + amount -->
    <div style="display:flex; align-items:center; gap:12px; margin-bottom:18px;">
      <div style="width:44px; height:44px; border-radius:50%; background:#1B3A57; display:flex; align-items:center; justify-content:center; font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:16px; box-shadow:0 0 0 2.5px #9B7FE0; flex-shrink:0;">C</div>
      <div style="flex:1; min-width:0;">
        <div style="font-size:15px; font-weight:600;">Cathy</div>
        <div style="font-size:12px; color:#93A2B8; margin-top:1px;">Cycle 7 &middot; Due Sep 1 &middot; submitted 10:42 AM</div>
      </div>
      <div style="text-align:right; flex-shrink:0;">
        <div style="font-family:'Space Grotesk',sans-serif; font-weight:800; font-size:19px;">&#8369;1,000</div>
      </div>
    </div>

    <!-- proof of payment — tappable, opens zoom -->
    <div style="font-size:11px; color:#93A2B8; text-transform:uppercase; letter-spacing:.04em; margin-bottom:8px;">Proof of payment</div>
    <button id="pf-proof-open" class="pf-chip" style="position:relative; width:100%; height:220px; border-radius:16px; border:none; padding:0; cursor:zoom-in; overflow:hidden; background:linear-gradient(160deg, #EAF3EE, #D8E9E0);">
      <div style="position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:20px;">
        <div style="width:52px; height:52px; border-radius:50%; background:rgba(76,175,131,0.16); display:flex; align-items:center; justify-content:center;">
          <svg class="icon" viewBox="0 0 24 24" style="width:26px; height:26px; color:#2E8B5C; stroke-width:2.6;"><polyline points="4 12 10 18 20 6"/></svg>
        </div>
        <div style="font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:15px; color:#14213D;">Payment Successful</div>
        <div style="font-size:12px; color:#4A5A50;">GCash &middot; Ref No. 7284 1190 3352</div>
        <div style="font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:20px; color:#14213D; margin-top:2px;">&#8369;1,000.00</div>
      </div>
      <span style="position:absolute; bottom:10px; right:10px; width:26px; height:26px; border-radius:50%; background:rgba(13,27,42,0.75); display:flex; align-items:center; justify-content:center;">
        <svg class="icon" viewBox="0 0 24 24" style="width:13px; height:13px; color:#fff; stroke-width:2.4;"><path d="M4 8V5a1 1 0 0 1 1-1h3"/><path d="M16 4h3a1 1 0 0 1 1 1v3"/><path d="M20 16v3a1 1 0 0 1-1 1h-3"/><path d="M8 20H5a1 1 0 0 1-1-1v-3"/></svg>
      </span>
    </button>
    <div style="font-size:10.5px; color:#93A2B8; text-align:center; margin-top:6px;">Tap the screenshot to enlarge</div>

    <!-- default actions -->
    <div id="pf-review-actions" style="margin-top:20px; display:flex; flex-direction:column; gap:10px;">
      <button id="pf-confirm-btn" class="pf-cta" style="width:100%; height:54px; border:none; border-radius:16px; background:linear-gradient(135deg, #4CAF83, #6FD1A3); color:#08130E; font-family:'Inter',sans-serif; font-weight:700; font-size:15px; cursor:pointer; box-shadow:0 14px 26px -10px rgba(76,175,131,0.5); display:flex; align-items:center; justify-content:center; gap:8px; transition:transform .1s ease;">
        <svg class="icon" viewBox="0 0 24 24" style="width:17px; height:17px; stroke-width:2.8;"><polyline points="4 12 10 18 20 6"/></svg>
        Confirm Payment
      </button>
      <button id="pf-reject-btn" class="pf-chip" style="width:100%; height:44px; border-radius:14px; background:none; border:1px solid rgba(225,83,83,0.4); color:#E15353; font-family:'Inter',sans-serif; font-weight:600; font-size:13.5px; cursor:pointer;">Reject claim</button>
    </div>

    <!-- reject confirmation (hidden until "Reject claim" is tapped) -->
    <div id="pf-reject-confirm" style="display:none; margin-top:20px; padding:14px; border-radius:16px; background:rgba(225,83,83,0.08); border:1px solid rgba(225,83,83,0.35);">
      <div style="display:flex; align-items:flex-start; gap:10px; margin-bottom:14px;">
        <svg class="icon" viewBox="0 0 24 24" style="width:17px; height:17px; color:#E15353; flex-shrink:0; margin-top:1px;"><path d="M10.3 4.6 2.6 18a2 2 0 0 0 1.7 3h15.4a2 2 0 0 0 1.7-3L13.7 4.6a2 2 0 0 0-3.4 0Z"/><path d="M12 9.5v4"/><circle cx="12" cy="17" r=".9" fill="currentColor" stroke="none"/></svg>
        <div style="font-size:12.5px; color:#EDEFF2; line-height:1.5;">Reject Cathy's &#8369;1,000 claim for Cycle 7? Her screenshot is kept in the archive. This can't be undone.</div>
      </div>
      <div style="display:flex; gap:8px;">
        <button id="pf-reject-cancel" class="pf-chip" style="flex:1; height:44px; border-radius:12px; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.14); color:#EDEFF2; font-family:'Inter',sans-serif; font-size:13px; font-weight:600; cursor:pointer;">Cancel</button>
        <button id="pf-reject-yes" class="pf-chip" style="flex:1; height:44px; border-radius:12px; background:#E15353; border:none; color:#fff; font-family:'Inter',sans-serif; font-size:13px; font-weight:700; cursor:pointer;">Yes, reject</button>
      </div>
    </div>
  </div>

  <!-- proof zoom lightbox — hidden until tapped -->
  <div id="pf-lightbox" style="position:absolute; inset:0; z-index:10; background:rgba(5,10,18,0.94); display:none; flex-direction:column; align-items:center; justify-content:center; gap:20px; padding:24px;">
    <div style="width:100%; max-width:320px; border-radius:20px; overflow:hidden; background:linear-gradient(160deg, #EAF3EE, #D8E9E0); padding:36px 20px;">
      <div style="display:flex; flex-direction:column; align-items:center; gap:12px;">
        <div style="width:64px; height:64px; border-radius:50%; background:rgba(76,175,131,0.16); display:flex; align-items:center; justify-content:center;">
          <svg class="icon" viewBox="0 0 24 24" style="width:32px; height:32px; color:#2E8B5C; stroke-width:2.6;"><polyline points="4 12 10 18 20 6"/></svg>
        </div>
        <div style="font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:18px; color:#14213D;">Payment Successful</div>
        <div style="font-size:13px; color:#4A5A50;">GCash &middot; Ref No. 7284 1190 3352</div>
        <div style="font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:26px; color:#14213D; margin-top:4px;">&#8369;1,000.00</div>
      </div>
    </div>
    <button id="pf-lightbox-close" class="pf-chip" style="display:flex; align-items:center; gap:6px; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.16); color:#EDEFF2; font-family:'Inter',sans-serif; font-size:13.5px; font-weight:600; padding:10px 20px; border-radius:22px; cursor:pointer;">
      <svg class="icon" viewBox="0 0 24 24" style="width:14px; height:14px;"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
      Close
    </button>
  </div>

</div>
</x-dc>
<script data-dc-script>
class Component extends DCLogic {
  componentDidMount() {
    var proofOpenBtn = document.getElementById('pf-proof-open');
    var lightbox = document.getElementById('pf-lightbox');
    var lightboxClose = document.getElementById('pf-lightbox-close');
    if (proofOpenBtn && lightbox) proofOpenBtn.addEventListener('click', function () { lightbox.style.display = 'flex'; });
    if (lightboxClose && lightbox) lightboxClose.addEventListener('click', function () { lightbox.style.display = 'none'; });
    if (lightbox) lightbox.addEventListener('click', function (e) { if (e.target === lightbox) lightbox.style.display = 'none'; });

    var actions = document.getElementById('pf-review-actions');
    var confirmBox = document.getElementById('pf-reject-confirm');
    var rejectBtn = document.getElementById('pf-reject-btn');
    var cancelBtn = document.getElementById('pf-reject-cancel');
    var yesBtn = document.getElementById('pf-reject-yes');
    if (rejectBtn) rejectBtn.addEventListener('click', function () {
      actions.style.display = 'none';
      confirmBox.style.display = 'block';
      confirmBox.style.animation = 'pfShake .4s ease';
    });
    if (cancelBtn) cancelBtn.addEventListener('click', function () {
      confirmBox.style.display = 'none';
      actions.style.display = 'flex';
    });
    if (yesBtn) yesBtn.addEventListener('click', function () {
      yesBtn.textContent = 'Rejected';
      yesBtn.disabled = true;
      yesBtn.style.opacity = '0.7';
    });
  }
}
</script>
</body>
</html>
