<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: #F5A623; }
    .icon { display: block; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    @keyframes pfSheetUp { from { opacity: 0; transform: translateY(28px); } to { opacity: 1; transform: translateY(0); } }
    .pf-sheet { animation: pfSheetUp .38s cubic-bezier(.22,1,.36,1) both; }
    .pf-chip:active { transform: scale(0.95); }
    .pf-cta:active { transform: scale(0.97); }
  </style>
</helmet>

<div style="position:relative; width:390px; height:640px; overflow:hidden; background:#0D1B2A; border-radius:38px; border:1px solid rgba(255,255,255,0.08); font-family:'Inter',sans-serif; color:#EDEFF2;">

  <div style="padding:28px 20px 0; opacity:0.28; filter:blur(1.5px);">
    <div style="font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:20px;">Menu</div>
  </div>
  <div style="position:absolute; inset:0; background:rgba(5,10,18,0.6);"></div>

  <!-- GAP: restoring a bad/corrupt file previously had no defined failure state — this is that state -->
  <div class="pf-sheet" style="position:absolute; left:0; right:0; bottom:0; background:linear-gradient(180deg, rgba(20,42,66,0.97), rgba(13,27,42,0.99)); border-top:1px solid rgba(225,83,83,0.3); border-radius:26px 26px 0 0; box-shadow:0 -20px 50px -20px rgba(0,0,0,0.7); padding:12px 22px calc(28px + env(safe-area-inset-bottom, 0px));">

    <div style="width:36px; height:4px; border-radius:3px; background:rgba(255,255,255,0.18); margin:0 auto 16px;"></div>

    <div style="display:flex; flex-direction:column; align-items:center; text-align:center; padding:14px 4px 6px;">
      <div style="width:56px; height:56px; border-radius:50%; background:rgba(225,83,83,0.14); display:flex; align-items:center; justify-content:center; margin-bottom:16px;">
        <svg class="icon" viewBox="0 0 24 24" style="width:26px; height:26px; color:#E15353;"><circle cx="12" cy="12" r="9"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
      </div>
      <div style="font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:17px; margin-bottom:8px;">This isn't a Power Fund backup</div>
      <div style="font-size:12.5px; color:#93A2B8; line-height:1.6; margin-bottom:6px;">"vacation-photos.json" doesn't match the backup format this app exports. Nothing was changed &mdash; your current data is untouched.</div>
    </div>

    <div style="display:flex; align-items:center; gap:10px; padding:12px 14px; border-radius:14px; background:rgba(225,83,83,0.06); border:1px solid rgba(225,83,83,0.25); margin:16px 0 22px;">
      <svg class="icon" viewBox="0 0 24 24" style="width:15px; height:15px; color:#E15353; flex-shrink:0;"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>
      <div style="font-size:11.5px; color:#93A2B8; line-height:1.5;">Look for a file named like <b style="color:#EDEFF2;">power-fund-backup-YYYY-MM-DD.json</b>, exported from Menu &rarr; Backup &amp; Restore on this or another member's device.</div>
    </div>

    <button class="pf-cta" style="width:100%; height:54px; border:none; border-radius:16px; background:linear-gradient(135deg,#F5A623,#e0951d); color:#14213D; font-family:'Inter',sans-serif; font-weight:700; font-size:15px; cursor:pointer; margin-bottom:10px;">Choose another file</button>
    <button class="pf-chip" style="width:100%; text-align:center; background:none; border:none; color:#93A2B8; font-family:'Inter',sans-serif; font-size:13px; font-weight:600; cursor:pointer; padding:10px 0 2px;">Cancel</button>
  </div>

</div>
</x-dc>
</body>
</html>
