<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: #F5A623; }
    a:hover { color: #ffb733; }
    .icon { display: block; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .pf-fade { opacity: 0; animation: pfFadeUp .4s cubic-bezier(.22,1,.36,1) both; }
    @keyframes pfFadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pfSheetUp { from { opacity: 0; transform: translateY(28px); } to { opacity: 1; transform: translateY(0); } }
    .pf-sheet { animation: pfSheetUp .38s cubic-bezier(.22,1,.36,1) both; }
    .pf-row:active { background: rgba(255,255,255,0.06) !important; }
    .pf-chip:active { transform: scale(0.95); }
    .pf-cta:active { transform: scale(0.98); }
  </style>
</helmet>

<div style="position:relative; width:390px; height:1080px; overflow:hidden; background:#0D1B2A; border-radius:38px; border:1px solid rgba(255,255,255,0.08); font-family:'Inter',sans-serif; color:#EDEFF2;">

  <!-- dimmed backdrop hint -->
  <div class="pf-fade" style="padding:28px 20px 0; opacity:0.28; filter:blur(1.5px); animation-delay:0s;">
    <div style="font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:20px;">Menu</div>
  </div>
  <div style="position:absolute; inset:0; background:rgba(5,10,18,0.55);"></div>

  <!-- bottom sheet -->
  <div class="pf-sheet" style="position:absolute; left:0; right:0; bottom:0; background:linear-gradient(180deg, rgba(20,42,66,0.97), rgba(13,27,42,0.99)); border-top:1px solid rgba(255,255,255,0.14); border-radius:26px 26px 0 0; box-shadow:0 -20px 50px -20px rgba(0,0,0,0.7); padding:12px 22px calc(22px + env(safe-area-inset-bottom, 0px));">

    <div style="width:36px; height:4px; border-radius:3px; background:rgba(255,255,255,0.18); margin:0 auto 18px;"></div>

    <div style="display:flex; align-items:center; gap:10px; margin-bottom:18px;">
      <div style="width:36px; height:36px; border-radius:10px; background:#fff; display:flex; align-items:center; justify-content:center; flex-shrink:0; padding:5px;">
        <svg viewBox="0 0 24 24" style="width:100%; height:100%;">
          <rect x="3" y="3" width="7" height="7" fill="#0D1B2A"/><rect x="14" y="3" width="7" height="7" fill="none" stroke="#0D1B2A" stroke-width="1.5"/>
          <rect x="3" y="14" width="7" height="7" fill="none" stroke="#0D1B2A" stroke-width="1.5"/><rect x="15" y="15" width="5" height="5" fill="#0D1B2A"/>
        </svg>
      </div>
      <div>
        <div style="font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:17px;">Payment QR code</div>
        <div style="font-size:12px; color:#93A2B8; margin-top:1px;">Shown to members on the Contribute screen</div>
      </div>
    </div>

    <!-- current QR preview -->
    <div style="display:flex; flex-direction:column; align-items:center; padding:20px; border-radius:18px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.1); margin-bottom:16px;">
      <div style="width:150px; height:150px; border-radius:14px; background:#fff; padding:10px; margin-bottom:10px;">
        <svg viewBox="0 0 100 100" style="width:100%; height:100%;">
          <rect x="0" y="0" width="28" height="28" fill="#0D1B2A"/><rect x="6" y="6" width="16" height="16" fill="#fff"/><rect x="10" y="10" width="8" height="8" fill="#0D1B2A"/>
          <rect x="72" y="0" width="28" height="28" fill="#0D1B2A"/><rect x="78" y="6" width="16" height="16" fill="#fff"/><rect x="82" y="10" width="8" height="8" fill="#0D1B2A"/>
          <rect x="0" y="72" width="28" height="28" fill="#0D1B2A"/><rect x="6" y="78" width="16" height="16" fill="#fff"/><rect x="10" y="82" width="8" height="8" fill="#0D1B2A"/>
          <rect x="40" y="10" width="6" height="6" fill="#0D1B2A"/><rect x="52" y="10" width="6" height="6" fill="#0D1B2A"/><rect x="34" y="24" width="6" height="6" fill="#0D1B2A"/>
          <rect x="46" y="34" width="6" height="6" fill="#0D1B2A"/><rect x="58" y="40" width="6" height="6" fill="#0D1B2A"/><rect x="34" y="46" width="6" height="6" fill="#0D1B2A"/>
          <rect x="70" y="46" width="6" height="6" fill="#0D1B2A"/><rect x="46" y="58" width="6" height="6" fill="#0D1B2A"/><rect x="60" y="60" width="6" height="6" fill="#0D1B2A"/>
          <rect x="34" y="66" width="6" height="6" fill="#0D1B2A"/><rect x="46" y="76" width="6" height="6" fill="#0D1B2A"/><rect x="58" y="82" width="6" height="6" fill="#0D1B2A"/>
          <rect x="70" y="70" width="18" height="18" fill="#0D1B2A"/>
        </svg>
      </div>
      <div style="font-size:13px; font-weight:600; color:#EDEFF2;">GCash &middot; 09XX XXX XXXX</div>
      <div style="font-size:11.5px; color:#93A2B8; margin-top:2px;">Added Aug 12, 2026</div>
    </div>

    <div style="border-radius:16px; background:rgba(20,42,66,0.5); border:1px solid rgba(255,255,255,0.1); overflow:hidden; margin-bottom:16px;">
      <button class="pf-row" style="width:100%; display:flex; align-items:center; gap:12px; padding:14px; background:none; border:none; border-bottom:1px solid rgba(255,255,255,0.06); cursor:pointer; text-align:left;">
        <div style="width:36px; height:36px; border-radius:10px; background:rgba(245,166,35,0.14); display:flex; align-items:center; justify-content:center; flex-shrink:0;">
          <svg class="icon" viewBox="0 0 24 24" style="width:17px; height:17px; color:#F5A623;">
            <path d="M4 8h3l1.6-2.4A2 2 0 0 1 10.3 4.6h3.4a2 2 0 0 1 1.7 1L17 8h3a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-9a2 2 0 0 1 2-2Z"/>
            <circle cx="12" cy="14" r="3.6"/>
          </svg>
        </div>
        <span style="flex:1; font-size:14px; font-weight:500; color:#EDEFF2;">Take Photo</span>
      </button>
      <button class="pf-row" style="width:100%; display:flex; align-items:center; gap:12px; padding:14px; background:none; border:none; cursor:pointer; text-align:left;">
        <div style="width:36px; height:36px; border-radius:10px; background:rgba(76,217,192,0.14); display:flex; align-items:center; justify-content:center; flex-shrink:0;">
          <svg class="icon" viewBox="0 0 24 24" style="width:17px; height:17px; color:#4CD9C0;"><rect x="3" y="4" width="18" height="15" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="M21 15l-5.5-5-6 5.5-2-2L3 18"/></svg>
        </div>
        <span style="flex:1; font-size:14px; font-weight:500; color:#EDEFF2;">Choose from Library</span>
      </button>
    </div>

    <!-- reference note field -->
    <div style="margin-bottom:12px;">
      <label style="font-size:11px; color:#93A2B8; text-transform:uppercase; letter-spacing:.05em; margin-bottom:6px; display:block; padding-left:2px;">Bank / E-wallet</label>
      <select id="pf-qr-bank" style="width:100%; height:46px; border-radius:12px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.14); color:#EDEFF2; font-family:'Inter',sans-serif; font-size:13.5px; padding:0 14px;">
        <option>GCash</option>
        <option>Maya</option>
        <option>BPI</option>
        <option>BDO</option>
        <option>Metrobank</option>
        <option>Other</option>
      </select>
    </div>

    <div style="margin-bottom:12px;">
      <label style="font-size:11px; color:#93A2B8; text-transform:uppercase; letter-spacing:.05em; margin-bottom:6px; display:block; padding-left:2px;">Account number</label>
      <input id="pf-qr-number" type="text" value="09XX XXX XXXX" style="width:100%; height:46px; border-radius:12px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.14); color:#EDEFF2; font-family:'Inter',sans-serif; font-size:13.5px; padding:0 14px;">
    </div>

    <div style="margin-bottom:16px;">
      <label style="font-size:11px; color:#93A2B8; text-transform:uppercase; letter-spacing:.05em; margin-bottom:6px; display:block; padding-left:2px;">Account name</label>
      <input id="pf-qr-name" type="text" placeholder="e.g. Cathy Reyes" style="width:100%; height:46px; border-radius:12px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.14); color:#EDEFF2; font-family:'Inter',sans-serif; font-size:13.5px; padding:0 14px;">
    </div>

    <button id="pf-qr-save" class="pf-cta" style="width:100%; height:52px; border:none; border-radius:16px; background:linear-gradient(135deg,#F5A623,#e0951d); color:#14213D; font-family:'Inter',sans-serif; font-weight:700; font-size:14.5px; cursor:pointer; margin-bottom:10px;">Save Payment QR</button>
    <button class="pf-chip" style="width:100%; text-align:center; background:none; border:none; color:#93A2B8; font-family:'Inter',sans-serif; font-size:13px; font-weight:600; cursor:pointer; padding:10px 0 2px;">Cancel</button>
  </div>

</div>
</x-dc>
<script data-dc-script>
class Component extends DCLogic {
  componentDidMount() {
    var save = document.getElementById('pf-qr-save');
    if (save) save.addEventListener('click', function () {
      save.textContent = 'Saved';
      save.disabled = true;
      save.style.opacity = '0.75';
    });
  }
}
</script>
</body>
</html>
