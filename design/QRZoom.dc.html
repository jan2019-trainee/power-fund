<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: #F5A623; }
    a:hover { color: #ffb733; }
    .icon { display: block; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .pf-chip:active { transform: scale(0.95); }
  </style>
</helmet>

<div style="position:relative; width:390px; height:844px; overflow:hidden; background:#0D1B2A; border-radius:38px; border:1px solid rgba(255,255,255,0.08); font-family:'Inter',sans-serif; color:#EDEFF2;">

  <div style="position:absolute; inset:0; background:rgba(5,10,18,0.94); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:24px; padding:24px;">
    <div style="padding:20px; border-radius:20px; background:#fff;">
      <svg viewBox="0 0 100 100" style="width:230px; height:230px;">
        <rect x="6" y="6" width="18" height="18" fill="none" stroke="#0D1B2A" stroke-width="4"/><rect x="12" y="12" width="6" height="6" fill="#0D1B2A"/>
        <rect x="76" y="6" width="18" height="18" fill="none" stroke="#0D1B2A" stroke-width="4"/><rect x="82" y="12" width="6" height="6" fill="#0D1B2A"/>
        <rect x="6" y="76" width="18" height="18" fill="none" stroke="#0D1B2A" stroke-width="4"/><rect x="12" y="82" width="6" height="6" fill="#0D1B2A"/>
        <rect x="34" y="10" width="5" height="5" fill="#0D1B2A"/><rect x="44" y="10" width="5" height="5" fill="#0D1B2A"/><rect x="54" y="16" width="5" height="5" fill="#0D1B2A"/>
        <rect x="34" y="22" width="5" height="5" fill="#0D1B2A"/><rect x="60" y="28" width="5" height="5" fill="#0D1B2A"/><rect x="40" y="34" width="5" height="5" fill="#0D1B2A"/>
        <rect x="50" y="40" width="5" height="5" fill="#0D1B2A"/><rect x="66" y="40" width="5" height="5" fill="#0D1B2A"/><rect x="30" y="46" width="5" height="5" fill="#0D1B2A"/>
        <rect x="58" y="50" width="5" height="5" fill="#0D1B2A"/><rect x="70" y="54" width="5" height="5" fill="#0D1B2A"/><rect x="40" y="58" width="5" height="5" fill="#0D1B2A"/>
        <rect x="34" y="66" width="5" height="5" fill="#0D1B2A"/><rect x="46" y="70" width="5" height="5" fill="#0D1B2A"/><rect x="60" y="66" width="5" height="5" fill="#0D1B2A"/>
        <rect x="76" y="34" width="5" height="5" fill="#0D1B2A"/><rect x="86" y="44" width="5" height="5" fill="#0D1B2A"/><rect x="78" y="58" width="5" height="5" fill="#0D1B2A"/>

      </svg>
    </div>

</div>
</x-dc>
</body>
</html>
