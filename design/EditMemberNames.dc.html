<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: #F5A623; }
    a:hover { color: #ffb733; }
    .icon { display: block; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .pf-fade { opacity: 0; animation: pfFadeUp .4s cubic-bezier(.22,1,.36,1) both; }
    @keyframes pfFadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pfSheetUp { from { opacity: 0; transform: translateY(28px); } to { opacity: 1; transform: translateY(0); } }
    .pf-sheet { animation: pfSheetUp .38s cubic-bezier(.22,1,.36,1) both; }
    .pf-chip:active { transform: scale(0.95); }
    .pf-cta:not(:disabled):active { transform: scale(0.97); }
    input::placeholder { color: rgba(147,162,184,0.55); }
    input:focus { outline: none; border-color: #F5A623 !important; }
  </style>
</helmet>

<div style="position:relative; width:390px; height:820px; overflow:hidden; background:#0D1B2A; border-radius:38px; border:1px solid rgba(255,255,255,0.08); font-family:'Inter',sans-serif; color:#EDEFF2;">

  <!-- dimmed backdrop hint -->
  <div class="pf-fade" style="padding:28px 20px 0; opacity:0.28; filter:blur(1.5px); animation-delay:0s;">
    <div style="font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:20px;">Menu</div>
  </div>
  <div style="position:absolute; inset:0; background:rgba(5,10,18,0.55);"></div>

  <!-- bottom sheet -->
  <div class="pf-sheet" style="position:absolute; left:0; right:0; bottom:0; max-height:92%; overflow-y:auto; background:linear-gradient(180deg, rgba(20,42,66,0.97), rgba(13,27,42,0.99)); border-top:1px solid rgba(255,255,255,0.14); border-radius:26px 26px 0 0; box-shadow:0 -20px 50px -20px rgba(0,0,0,0.7); padding:12px 22px calc(22px + env(safe-area-inset-bottom, 0px));">

    <div style="width:36px; height:4px; border-radius:3px; background:rgba(255,255,255,0.18); margin:0 auto 16px;"></div>

    <div style="display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:6px;">
      <div style="font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:19px;">Edit Member Names</div>
      <button class="pf-chip" style="width:32px; height:32px; border-radius:50%; background:rgba(255,255,255,0.08); border:none; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;">
        <svg class="icon" viewBox="0 0 24 24" style="width:15px; height:15px; color:#EDEFF2;"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
      </button>
    </div>
    <div style="font-size:12.5px; color:#93A2B8; margin-bottom:18px;">All names must be filled in and unique.</div>

    <div style="display:flex; flex-direction:column; gap:10px; margin-bottom:8px;">
      <div style="display:flex; align-items:center; gap:10px;">
        <div style="width:32px; height:32px; border-radius:50%; background:#1B3A57; display:flex; align-items:center; justify-content:center; font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:12px; box-shadow:0 0 0 2px #4CAF83; flex-shrink:0;">A</div>
        <input class="pf-name-field" data-idx="0" value="Ana" style="flex:1; padding:11px 14px; border-radius:12px; background:rgba(20,42,66,0.5); border:1.5px solid rgba(255,255,255,0.14); color:#EDEFF2; font-family:'Inter',sans-serif; font-size:14px;">
      </div>
      <div style="display:flex; align-items:center; gap:10px;">
        <div style="width:32px; height:32px; border-radius:50%; background:#1B3A57; display:flex; align-items:center; justify-content:center; font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:12px; box-shadow:0 0 0 2px #F5A623; flex-shrink:0;">B</div>
        <input class="pf-name-field" data-idx="1" value="Ben" style="flex:1; padding:11px 14px; border-radius:12px; background:rgba(20,42,66,0.5); border:1.5px solid rgba(255,255,255,0.14); color:#EDEFF2; font-family:'Inter',sans-serif; font-size:14px;">
      </div>
      <div style="display:flex; align-items:center; gap:10px;">
        <div style="width:32px; height:32px; border-radius:50%; background:#1B3A57; display:flex; align-items:center; justify-content:center; font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:12px; box-shadow:0 0 0 2px #9B7FE0; flex-shrink:0;">C</div>
        <input class="pf-name-field" data-idx="2" value="Cathy" style="flex:1; padding:11px 14px; border-radius:12px; background:rgba(20,42,66,0.5); border:1.5px solid rgba(255,255,255,0.14); color:#EDEFF2; font-family:'Inter',sans-serif; font-size:14px;">
      </div>
      <div style="display:flex; align-items:center; gap:10px;">
        <div style="width:32px; height:32px; border-radius:50%; background:#1B3A57; display:flex; align-items:center; justify-content:center; font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:12px; box-shadow:0 0 0 2px #E15353; flex-shrink:0;">D</div>
        <input class="pf-name-field" data-idx="3" value="Dan" style="flex:1; padding:11px 14px; border-radius:12px; background:rgba(20,42,66,0.5); border:1.5px solid rgba(255,255,255,0.14); color:#EDEFF2; font-family:'Inter',sans-serif; font-size:14px;">
      </div>
      <div style="display:flex; align-items:center; gap:10px;">
        <div style="width:32px; height:32px; border-radius:50%; background:#1B3A57; display:flex; align-items:center; justify-content:center; font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:12px; box-shadow:0 0 0 1.5px rgba(255,255,255,0.14); color:#93A2B8; flex-shrink:0;">E</div>
        <input class="pf-name-field" data-idx="4" value="Elena" style="flex:1; padding:11px 14px; border-radius:12px; background:rgba(20,42,66,0.5); border:1.5px solid rgba(255,255,255,0.14); color:#EDEFF2; font-family:'Inter',sans-serif; font-size:14px;">
      </div>
    </div>

    <div id="pf-names-hint" style="font-size:11.5px; color:#93A2B8; min-height:16px; margin-bottom:14px;"></div>

    <button id="pf-names-save" class="pf-cta" style="width:100%; height:52px; border:none; border-radius:16px; background:linear-gradient(135deg, #F5A623, #FFC966); color:#14213D; font-family:'Inter',sans-serif; font-weight:700; font-size:14.5px; cursor:pointer; box-shadow:0 12px 22px -10px rgba(245,166,35,0.5); transition:transform .1s ease, opacity .15s ease;">Save Changes</button>
    <button class="pf-chip" style="width:100%; text-align:center; background:none; border:none; color:#93A2B8; font-family:'Inter',sans-serif; font-size:13px; font-weight:600; cursor:pointer; padding:12px 0 2px;">Cancel</button>
  </div>

</div>
</x-dc>
<script data-dc-script>
class Component extends DCLogic {
  componentDidMount() {
    var fields = Array.prototype.slice.call(document.querySelectorAll('.pf-name-field'));
    var hint = document.getElementById('pf-names-hint');
    var btn = document.getElementById('pf-names-save');
    function check() {
      var values = fields.map(function (f) { return (f.value || '').trim(); });
      var empty = values.some(function (v) { return !v; });
      var lower = values.map(function (v) { return v.toLowerCase(); });
      var dupe = new Set(lower).size !== lower.length;
      var ok = !empty && !dupe;
      if (empty) {
        hint.textContent = 'All names must be filled in.';
        hint.style.color = '#E15353';
      } else if (dupe) {
        hint.textContent = 'Names must be unique.';
        hint.style.color = '#E15353';
      } else {
        hint.textContent = '';
      }
      btn.disabled = !ok;
      btn.style.opacity = ok ? '1' : '0.5';
    }
    fields.forEach(function (f) { f.addEventListener('input', check); });
    check();
  }
}
</script>
</body>
</html>
