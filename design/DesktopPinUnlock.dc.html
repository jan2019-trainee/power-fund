<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: #F5A623; }
    .icon { display: block; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .pf-modal { opacity: 0; animation: pfModalIn .32s cubic-bezier(.22,1,.36,1) both; }
    @keyframes pfModalIn { from { opacity: 0; transform: translate(-50%,-50%) translateY(10px) scale(0.98); } to { opacity: 1; transform: translate(-50%,-50%) translateY(0) scale(1); } }
    .pf-x:hover { background: rgba(255,255,255,0.08) !important; }
    .pf-key:hover { background: rgba(255,255,255,0.08) !important; }
    .pf-key:active { transform: scale(0.95); }
    @keyframes pfDotPop { 0% { transform: scale(0.6); } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }
    .pf-dot-filled { animation: pfDotPop .28s cubic-bezier(.22,1,.36,1) both; }
  </style>
</helmet>

<div style="position:relative; width:1440px; height:900px; overflow:hidden; background:#0D1B2A; border-radius:16px; border:1px solid rgba(255,255,255,0.08); font-family:'Inter',sans-serif; color:#EDEFF2;">

  <div style="opacity:0.35; filter:blur(1.5px); display:flex; height:100%;">
    <div style="width:240px; height:100%; background:rgba(255,255,255,0.02); border-right:1px solid rgba(255,255,255,0.08);"></div>
    <div style="flex:1; padding:32px 40px;"><div style="font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:24px;">Good evening, Cathy</div></div>
  </div>
  <div style="position:absolute; inset:0; background:rgba(5,10,18,0.6);"></div>

  <div class="pf-modal" style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:340px; background:linear-gradient(180deg, rgba(20,42,66,0.98), rgba(13,27,42,0.99)); border:1px solid rgba(255,255,255,0.12); border-radius:22px; box-shadow:0 30px 80px -20px rgba(0,0,0,0.7); padding:28px 26px;">

    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;">
      <div style="font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:17px;">Enter treasurer PIN</div>
      <button class="pf-x" style="width:30px; height:30px; border-radius:9px; background:none; border:none; display:flex; align-items:center; justify-content:center; cursor:pointer;">
        <svg class="icon" viewBox="0 0 24 24" style="width:15px; height:15px; color:#93A2B8;"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div style="font-size:12px; color:#93A2B8; margin-bottom:22px;">4-digit PIN</div>

    <div style="display:flex; justify-content:center; gap:16px; margin-bottom:26px;">
      <div class="pf-dot-filled" style="width:16px; height:16px; border-radius:50%; background:#F5A623;"></div>
      <div class="pf-dot-filled" style="width:16px; height:16px; border-radius:50%; background:#F5A623;"></div>
      <div class="pf-dot-filled" style="width:16px; height:16px; border-radius:50%; background:#F5A623;"></div>
      <div style="width:16px; height:16px; border-radius:50%; background:none; border:2px solid rgba(255,255,255,0.25);"></div>
    </div>

    <div style="display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:8px;">
      <button class="pf-key" style="height:54px; border-radius:14px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.1); color:#EDEFF2; font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:18px; cursor:pointer;">1</button>
      <button class="pf-key" style="height:54px; border-radius:14px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.1); color:#EDEFF2; font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:18px; cursor:pointer;">2</button>
      <button class="pf-key" style="height:54px; border-radius:14px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.1); color:#EDEFF2; font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:18px; cursor:pointer;">3</button>
      <button class="pf-key" style="height:54px; border-radius:14px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.1); color:#EDEFF2; font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:18px; cursor:pointer;">4</button>
      <button class="pf-key" style="height:54px; border-radius:14px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.1); color:#EDEFF2; font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:18px; cursor:pointer;">5</button>
      <button class="pf-key" style="height:54px; border-radius:14px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.1); color:#EDEFF2; font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:18px; cursor:pointer;">6</button>
      <button class="pf-key" style="height:54px; border-radius:14px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.1); color:#EDEFF2; font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:18px; cursor:pointer;">7</button>
      <button class="pf-key" style="height:54px; border-radius:14px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.1); color:#EDEFF2; font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:18px; cursor:pointer;">8</button>
      <button class="pf-key" style="height:54px; border-radius:14px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.1); color:#EDEFF2; font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:18px; cursor:pointer;">9</button>
      <div></div>
      <button class="pf-key" style="height:54px; border-radius:14px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.1); color:#EDEFF2; font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:18px; cursor:pointer;">0</button>
      <button class="pf-key" style="height:54px; border-radius:14px; background:none; border:none; color:#93A2B8; display:flex; align-items:center; justify-content:center; cursor:pointer;">
        <svg class="icon" viewBox="0 0 24 24" style="width:18px; height:18px;"><path d="M21 4H8l-7 8 7 8h13a1 1 0 0 0 1-1V5a1 1 0 0 0-1-1Z"/><path d="M14 9l-4 6M10 9l4 6"/></svg>
      </button>
    </div>

    <div style="text-align:center; margin-top:8px;">
      <a href="#" style="font-size:12.5px; font-weight:600;">Forgot PIN?</a>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
