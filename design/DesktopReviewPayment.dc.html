<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: #F5A623; }
    .icon { display: block; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .pf-modal { opacity: 0; animation: pfModalIn .32s cubic-bezier(.22,1,.36,1) both; }
    @keyframes pfModalIn { from { opacity: 0; transform: translate(-50%,-50%) translateY(10px) scale(0.98); } to { opacity: 1; transform: translate(-50%,-50%) translateY(0) scale(1); } }
    .pf-x:hover { background: rgba(255,255,255,0.08) !important; }
    .pf-btn-confirm:active, .pf-btn-reject:active, .pf-btn-yes:active { transform: scale(0.98); }
  </style>
</helmet>

<div style="position:relative; width:1440px; height:900px; overflow:hidden; background:#0D1B2A; border-radius:16px; border:1px solid rgba(255,255,255,0.08); font-family:'Inter',sans-serif; color:#EDEFF2;">

  <div style="opacity:0.35; filter:blur(1.5px); display:flex; height:100%;">
    <div style="width:240px; height:100%; background:rgba(255,255,255,0.02); border-right:1px solid rgba(255,255,255,0.08);"></div>
    <div style="flex:1; padding:32px 40px;">
      <div style="font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:24px;">Good evening, Cathy</div>
    </div>
  </div>
  <div style="position:absolute; inset:0; background:rgba(5,10,18,0.6);"></div>

  <div class="pf-modal" style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:560px; background:linear-gradient(180deg, rgba(20,42,66,0.98), rgba(13,27,42,0.99)); border:1px solid rgba(255,255,255,0.12); border-radius:22px; box-shadow:0 30px 80px -20px rgba(0,0,0,0.7); padding:30px 32px;">

    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:20px;">
      <div style="font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:19px;">Review payment</div>
      <button class="pf-x" style="width:32px; height:32px; border-radius:9px; background:none; border:none; display:flex; align-items:center; justify-content:center; cursor:pointer;">
        <svg class="icon" viewBox="0 0 24 24" style="width:16px; height:16px; color:#93A2B8;"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <div style="display:flex; align-items:center; gap:12px; padding:14px; border-radius:14px; background:rgba(155,127,224,0.08); border:1px solid rgba(155,127,224,0.3); margin-bottom:18px;">
      <div style="width:38px; height:38px; border-radius:50%; background:#1B3A57; display:flex; align-items:center; justify-content:center; font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:14px; box-shadow:0 0 0 2px #9B7FE0; flex-shrink:0;">C</div>
      <div style="flex:1;">
        <div style="font-size:13.5px; font-weight:600;">Cathy</div>
        <div style="font-size:11.5px; color:#9B7FE0;">Round 2 &middot; Cycle 7 &middot; &#8369;1,000</div>
      </div>
      <span style="font-size:10.5px; font-weight:700; color:#9B7FE0; background:rgba(155,127,224,0.16); padding:3px 9px; border-radius:20px;">In review</span>
    </div>

    <button id="pf-proof-open" style="width:100%; border:none; background:none; padding:0; cursor:pointer; margin-bottom:20px;">
      <div style="width:100%; height:220px; border-radius:14px; background:linear-gradient(135deg,#2a4a6b,#16324d); border:1px solid rgba(255,255,255,0.1); display:flex; align-items:center; justify-content:center; position:relative;">
        <svg class="icon" viewBox="0 0 24 24" style="width:32px; height:32px; color:rgba(255,255,255,0.3);"><rect x="3" y="4" width="18" height="15" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="M21 15l-5.5-5-6 5.5-2-2L3 18"/></svg>
        <span style="position:absolute; bottom:12px; right:14px; font-size:11px; color:#93A2B8; background:rgba(5,10,18,0.6); padding:4px 10px; border-radius:20px;">Click to enlarge</span>
      </div>
    </button>

    <div id="pf-review-actions" style="display:flex; gap:12px;">
      <button class="pf-btn-reject" style="flex:1; height:50px; border-radius:14px; background:rgba(225,83,83,0.1); border:1px solid rgba(225,83,83,0.35); color:#E15353; font-family:'Inter',sans-serif; font-weight:700; font-size:14px; cursor:pointer;">Reject</button>
      <button class="pf-btn-confirm" style="flex:2; height:50px; border-radius:14px; background:#4CAF83; border:none; color:#fff; font-family:'Inter',sans-serif; font-weight:700; font-size:14px; cursor:pointer;">Confirm payment</button>
    </div>

    <div id="pf-reject-confirm" style="display:none; padding:16px; border-radius:14px; background:rgba(225,83,83,0.08); border:1px solid rgba(225,83,83,0.3);">
      <div style="font-size:12.5px; color:#93A2B8; line-height:1.5; margin-bottom:14px;">Reject this proof of payment? Cathy will need to resubmit for this cycle.</div>
      <div style="display:flex; gap:10px;">
        <button id="pf-reject-cancel" style="flex:1; height:42px; border-radius:12px; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.14); color:#EDEFF2; font-family:'Inter',sans-serif; font-weight:600; font-size:13px; cursor:pointer;">Cancel</button>
        <button id="pf-reject-yes" class="pf-btn-yes" style="flex:1; height:42px; border-radius:12px; background:#E15353; border:none; color:#fff; font-family:'Inter',sans-serif; font-weight:700; font-size:13px; cursor:pointer;">Yes, reject</button>
      </div>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script>
class Component extends DCLogic {
  componentDidMount() {
    var actions = document.getElementById('pf-review-actions');
    var rejectPanel = document.getElementById('pf-reject-confirm');
    var rejectBtn = document.querySelector('.pf-btn-reject');
    var cancelBtn = document.getElementById('pf-reject-cancel');
    var yesBtn = document.getElementById('pf-reject-yes');
    if (rejectBtn) rejectBtn.addEventListener('click', function () {
      actions.style.display = 'none';
      rejectPanel.style.display = 'block';
    });
    if (cancelBtn) cancelBtn.addEventListener('click', function () {
      actions.style.display = 'flex';
      rejectPanel.style.display = 'none';
    });
    if (yesBtn) yesBtn.addEventListener('click', function () {
      yesBtn.textContent = 'Rejected';
      yesBtn.disabled = true;
      yesBtn.style.opacity = '0.7';
    });
  }
}
</script>
</body>
</html>
