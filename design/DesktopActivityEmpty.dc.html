<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: #F5A623; }
    .icon { display: block; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .pf-fade { opacity: 0; animation: pfFadeUp .5s cubic-bezier(.22,1,.36,1) both; }
    @keyframes pfFadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .pf-nav-item:hover { background: rgba(255,255,255,0.05) !important; }
    .pf-filter.active { background: rgba(245,166,35,0.14) !important; border-color: rgba(245,166,35,0.4) !important; color: #F5A623 !important; }
  </style>
</helmet>

<div style="position:relative; width:1440px; height:900px; overflow:hidden; background:#0D1B2A; border-radius:16px; border:1px solid rgba(255,255,255,0.08); font-family:'Inter',sans-serif; color:#EDEFF2; display:flex;">

  <div style="width:240px; flex-shrink:0; height:100%; background:rgba(255,255,255,0.02); border-right:1px solid rgba(255,255,255,0.08); display:flex; flex-direction:column; padding:24px 16px;">
    <div style="display:flex; align-items:center; gap:10px; padding:0 8px 28px;">
      <div style="width:32px; height:32px; border-radius:9px; background:linear-gradient(135deg,#F5A623,#4CD9C0); display:flex; align-items:center; justify-content:center; font-family:'Space Grotesk',sans-serif; font-weight:800; font-size:15px; color:#14213D;">P</div>
      <div style="font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:15px;">Power Fund</div>
    </div>
    <div style="display:flex; flex-direction:column; gap:2px;">
      <div class="pf-nav-item" style="display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:10px; cursor:pointer;">
        <svg class="icon" viewBox="0 0 24 24" style="width:18px; height:18px; color:#93A2B8;"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9a1 1 0 0 0 1 1h3v-6h4v6h3a1 1 0 0 0 1-1v-9"/></svg>
        <span style="font-size:13.5px; font-weight:500; color:#93A2B8;">Home</span>
      </div>
      <div class="pf-nav-item" style="display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:10px; cursor:pointer;">
        <svg class="icon" viewBox="0 0 24 24" style="width:18px; height:18px; color:#93A2B8;"><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/></svg>
        <span style="font-size:13.5px; font-weight:500; color:#93A2B8;">Rounds</span>
      </div>
      <div class="pf-nav-item" style="display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:10px; cursor:pointer;">
        <svg class="icon" viewBox="0 0 24 24" style="width:18px; height:18px; color:#93A2B8;"><circle cx="9" cy="8" r="3.2"/><path d="M2.8 20.2c.5-3.6 3-5.6 6.2-5.6s5.7 2 6.2 5.6"/><circle cx="17.3" cy="8.6" r="2.4"/><path d="M15.9 14.3c2.3.5 4 2.3 4.3 5.4"/></svg>
        <span style="font-size:13.5px; font-weight:500; color:#93A2B8;">Members</span>
      </div>
      <div class="pf-nav-item" style="display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:10px; background:rgba(245,166,35,0.12); cursor:pointer;">
        <svg class="icon" viewBox="0 0 24 24" style="width:18px; height:18px; color:#F5A623;"><line x1="8" y1="7" x2="20" y2="7"/><line x1="8" y1="12" x2="20" y2="12"/><line x1="8" y1="17" x2="20" y2="17"/><circle cx="4" cy="7" r="1" fill="currentColor" stroke="none"/><circle cx="4" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="4" cy="17" r="1" fill="currentColor" stroke="none"/></svg>
        <span style="font-size:13.5px; font-weight:600; color:#F5A623;">Activity</span>
      </div>
      <div class="pf-nav-item" style="display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:10px; cursor:pointer;">
        <svg class="icon" viewBox="0 0 24 24" style="width:18px; height:18px; color:#93A2B8;"><polyline points="3 16 9 10 13 14 21 5"/><polyline points="15 5 21 5 21 11"/></svg>
        <span style="font-size:13.5px; font-weight:500; color:#93A2B8;">Insights</span>
      </div>
    </div>
    <div style="flex:1;"></div>
    <div style="display:flex; align-items:center; gap:10px; padding:12px; border-radius:12px; background:rgba(76,175,131,0.1); border:1px solid rgba(76,175,131,0.3); margin-bottom:8px;">
      <div style="width:34px; height:34px; border-radius:10px; background:rgba(76,175,131,0.16); display:flex; align-items:center; justify-content:center; flex-shrink:0;">
        <svg class="icon" viewBox="0 0 24 24" style="width:16px; height:16px; color:#4CAF83;"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.4-2"/></svg>
      </div>
      <div style="min-width:0;">
        <div style="font-size:12.5px; font-weight:600;">Treasurer mode</div>
        <div style="font-size:11px; color:#4CAF83;">Active</div>
      </div>
    </div>
    <div class="pf-nav-item" style="display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:10px; cursor:pointer;">
      <div style="width:28px; height:28px; border-radius:50%; background:#1B3A57; display:flex; align-items:center; justify-content:center; font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:11px;">C</div>
      <span style="font-size:13px; font-weight:500; color:#EDEFF2;">Menu &amp; settings</span>
    </div>
  </div>

  <div style="flex:1; height:100%; overflow:hidden; padding:32px 40px; display:flex; flex-direction:column;">
    <div class="pf-fade" style="display:flex; align-items:center; justify-content:space-between; margin-bottom:20px;">
      <div>
        <div style="font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:24px;">Activity</div>
        <div style="font-size:13px; color:#93A2B8; margin-top:2px;">Full transaction history across all rounds</div>
      </div>
    </div>

    <div class="pf-fade" style="animation-delay:.04s; display:flex; align-items:center; gap:10px; margin-bottom:18px;">
      <button class="pf-filter active" style="height:34px; padding:0 16px; border-radius:9px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.1); color:#93A2B8; font-family:'Inter',sans-serif; font-weight:600; font-size:12.5px; cursor:pointer;">All</button>
      <button class="pf-filter" style="height:34px; padding:0 16px; border-radius:9px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.1); color:#93A2B8; font-family:'Inter',sans-serif; font-weight:600; font-size:12.5px; cursor:pointer;">Contributions</button>
      <button class="pf-filter" style="height:34px; padding:0 16px; border-radius:9px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.1); color:#93A2B8; font-family:'Inter',sans-serif; font-weight:600; font-size:12.5px; cursor:pointer;">Payouts</button>
    </div>

    <div class="pf-fade" style="animation-delay:.08s; flex:1; min-height:0; border-radius:18px; background:rgba(20,42,66,0.3); border:1px dashed rgba(255,255,255,0.12); display:flex; flex-direction:column; align-items:center; justify-content:center;">
      <div style="width:88px; height:88px; border-radius:22px; background:rgba(255,255,255,0.04); border:1px dashed rgba(255,255,255,0.14); display:flex; align-items:center; justify-content:center; margin-bottom:20px;">
        <svg class="icon" viewBox="0 0 24 24" style="width:36px; height:36px; color:rgba(255,255,255,0.22);"><line x1="8" y1="7" x2="20" y2="7"/><line x1="8" y1="12" x2="20" y2="12"/><line x1="8" y1="17" x2="20" y2="17"/><circle cx="4" cy="7" r="1" fill="currentColor" stroke="none"/><circle cx="4" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="4" cy="17" r="1" fill="currentColor" stroke="none"/></svg>
      </div>
      <div style="font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:17px; margin-bottom:6px;">No activity yet</div>
      <div style="font-size:13.5px; color:#93A2B8; max-width:320px; text-align:center; line-height:1.5;">Contributions, payouts, and admin actions will show up here once the fund gets going.</div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
