<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: #F5A623; }
    a:hover { color: #ffb733; }
    .icon { display: block; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .pf-fade { opacity: 0; animation: pfFadeUp .4s cubic-bezier(.22,1,.36,1) both; }
    @keyframes pfFadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pfSheetUp { from { opacity: 0; transform: translateY(28px); } to { opacity: 1; transform: translateY(0); } }
    .pf-sheet { animation: pfSheetUp .38s cubic-bezier(.22,1,.36,1) both; }
    @keyframes pfDotPop { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    @keyframes pfShake { 10%,90% { transform: translateX(-2px); } 20%,80% { transform: translateX(4px); } 30%,50%,70% { transform: translateX(-8px); } 40%,60% { transform: translateX(8px); } }
    .pf-shake { animation: pfShake .5s ease; }
    .pf-chip:active { transform: scale(0.95); }
    .pf-key:active { transform: scale(0.94); background: rgba(255,255,255,0.1) !important; }
    @media (prefers-reduced-motion: reduce) {
      .pf-fade, .pf-sheet { animation: none; opacity: 1; }
      .pf-shake { animation: none; }
    }
  </style>
</helmet>

<div style="position:relative; width:390px; height:760px; overflow:hidden; background:#0D1B2A; border-radius:38px; border:1px solid rgba(255,255,255,0.08); font-family:'Inter',sans-serif; color:#EDEFF2;">

  <div class="pf-fade" style="padding:28px 20px 0; opacity:0.28; filter:blur(1.5px); animation-delay:0s;">
    <div style="font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:20px;">Menu</div>
  </div>
  <div style="position:absolute; inset:0; background:rgba(5,10,18,0.6);"></div>

  <div class="pf-sheet" style="position:absolute; left:0; right:0; bottom:0; background:linear-gradient(180deg, rgba(20,42,66,0.97), rgba(13,27,42,0.99)); border-top:1px solid rgba(255,255,255,0.14); border-radius:26px 26px 0 0; box-shadow:0 -20px 50px -20px rgba(0,0,0,0.7); padding:12px 26px calc(24px + env(safe-area-inset-bottom, 0px));">

    <div style="width:36px; height:4px; border-radius:3px; background:rgba(255,255,255,0.18); margin:0 auto 18px;"></div>

    <div style="display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:14px;">
      <div>
        <div style="font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:19px;">Change PIN</div>
        <div id="pf-cp-step-label" style="font-size:12.5px; color:#93A2B8; margin-top:2px;">Enter your current PIN</div>
      </div>
      <button class="pf-chip" style="width:32px; height:32px; border-radius:50%; background:rgba(255,255,255,0.08); border:none; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;">
        <svg class="icon" viewBox="0 0 24 24" style="width:15px; height:15px; color:#EDEFF2;"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
      </button>
    </div>

    <!-- step dots (wizard progress, 3 steps) -->
    <div style="display:flex; justify-content:center; gap:6px; margin-bottom:18px;">
      <span id="pf-cp-progress-0" style="width:22px; height:4px; border-radius:2px; background:#F5A623;"></span>
      <span id="pf-cp-progress-1" style="width:22px; height:4px; border-radius:2px; background:rgba(255,255,255,0.15);"></span>
      <span id="pf-cp-progress-2" style="width:22px; height:4px; border-radius:2px; background:rgba(255,255,255,0.15);"></span>
    </div>

    <!-- PIN dots -->
    <div id="pf-cp-dots" style="display:flex; justify-content:center; gap:16px; margin-bottom:10px;">
      <span class="pf-dot" data-i="0" style="width:16px; height:16px; border-radius:50%; border:1.5px solid rgba(255,255,255,0.25); background:none;"></span>
      <span class="pf-dot" data-i="1" style="width:16px; height:16px; border-radius:50%; border:1.5px solid rgba(255,255,255,0.25); background:none;"></span>
      <span class="pf-dot" data-i="2" style="width:16px; height:16px; border-radius:50%; border:1.5px solid rgba(255,255,255,0.25); background:none;"></span>
      <span class="pf-dot" data-i="3" style="width:16px; height:16px; border-radius:50%; border:1.5px solid rgba(255,255,255,0.25); background:none;"></span>
    </div>
    <div id="pf-cp-error" style="text-align:center; font-size:11.5px; color:#E15353; font-weight:600; height:16px; margin-bottom:8px;"></div>

    <!-- numeric keypad -->
    <div id="pf-cp-keypad" style="display:grid; grid-template-columns:repeat(3, 1fr); gap:14px; max-width:280px; margin:0 auto;">
      <button class="pf-key" data-k="1" style="height:56px; border-radius:16px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.08); color:#EDEFF2; font-family:'Space Grotesk',sans-serif; font-size:20px; font-weight:600; cursor:pointer; transition:transform .1s ease;">1</button>
      <button class="pf-key" data-k="2" style="height:56px; border-radius:16px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.08); color:#EDEFF2; font-family:'Space Grotesk',sans-serif; font-size:20px; font-weight:600; cursor:pointer; transition:transform .1s ease;">2</button>
      <button class="pf-key" data-k="3" style="height:56px; border-radius:16px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.08); color:#EDEFF2; font-family:'Space Grotesk',sans-serif; font-size:20px; font-weight:600; cursor:pointer; transition:transform .1s ease;">3</button>
      <button class="pf-key" data-k="4" style="height:56px; border-radius:16px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.08); color:#EDEFF2; font-family:'Space Grotesk',sans-serif; font-size:20px; font-weight:600; cursor:pointer; transition:transform .1s ease;">4</button>
      <button class="pf-key" data-k="5" style="height:56px; border-radius:16px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.08); color:#EDEFF2; font-family:'Space Grotesk',sans-serif; font-size:20px; font-weight:600; cursor:pointer; transition:transform .1s ease;">5</button>
      <button class="pf-key" data-k="6" style="height:56px; border-radius:16px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.08); color:#EDEFF2; font-family:'Space Grotesk',sans-serif; font-size:20px; font-weight:600; cursor:pointer; transition:transform .1s ease;">6</button>
      <button class="pf-key" data-k="7" style="height:56px; border-radius:16px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.08); color:#EDEFF2; font-family:'Space Grotesk',sans-serif; font-size:20px; font-weight:600; cursor:pointer; transition:transform .1s ease;">7</button>
      <button class="pf-key" data-k="8" style="height:56px; border-radius:16px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.08); color:#EDEFF2; font-family:'Space Grotesk',sans-serif; font-size:20px; font-weight:600; cursor:pointer; transition:transform .1s ease;">8</button>
      <button class="pf-key" data-k="9" style="height:56px; border-radius:16px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.08); color:#EDEFF2; font-family:'Space Grotesk',sans-serif; font-size:20px; font-weight:600; cursor:pointer; transition:transform .1s ease;">9</button>
      <span></span>
      <button class="pf-key" data-k="0" style="height:56px; border-radius:16px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.08); color:#EDEFF2; font-family:'Space Grotesk',sans-serif; font-size:20px; font-weight:600; cursor:pointer; transition:transform .1s ease;">0</button>
      <button class="pf-key" data-k="back" style="height:56px; border-radius:16px; background:none; border:none; color:#93A2B8; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:transform .1s ease;">
        <svg class="icon" viewBox="0 0 24 24" style="width:22px; height:22px;"><path d="M21 4H8l-6 8 6 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2Z"/><line x1="18" y1="9" x2="12" y2="15"/><line x1="12" y1="9" x2="18" y2="15"/></svg>
      </button>
    </div>

    <!-- success state -->
    <div id="pf-cp-success" style="display:none; text-align:center; padding:20px 0 8px;">
      <div style="width:56px; height:56px; border-radius:50%; background:rgba(76,175,131,0.16); display:flex; align-items:center; justify-content:center; margin:0 auto 14px;">
        <svg class="icon" viewBox="0 0 24 24" style="width:26px; height:26px; color:#4CAF83; stroke-width:2.6;"><polyline points="4 12 10 18 20 6"/></svg>
      </div>
      <div style="font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:16px; margin-bottom:4px;">PIN changed</div>
      <div style="font-size:12.5px; color:#93A2B8;">Use your new PIN next time you unlock treasurer mode.</div>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script>
class Component extends DCLogic {
  componentDidMount() {
    var steps = ['Enter your current PIN', 'Choose a new PIN', 'Confirm your new PIN'];
    var stepIndex = 0;
    var currentPin = '2468';
    var newPin = '';
    var entered = '';
    var label = document.getElementById('pf-cp-step-label');
    var dots = Array.prototype.slice.call(document.querySelectorAll('.pf-dot'));
    var dotsWrap = document.getElementById('pf-cp-dots');
    var error = document.getElementById('pf-cp-error');
    var keypad = document.getElementById('pf-cp-keypad');
    var success = document.getElementById('pf-cp-success');
    var progress = [0, 1, 2].map(function (i) { return document.getElementById('pf-cp-progress-' + i); });

    function renderDots() {
      dots.forEach(function (d, i) {
        if (i < entered.length) {
          d.style.background = '#F5A623';
          d.style.border = 'none';
        } else {
          d.style.background = 'none';
          d.style.border = '1.5px solid rgba(255,255,255,0.25)';
        }
      });
    }
    function renderProgress() {
      progress.forEach(function (p, i) {
        p.style.background = i <= stepIndex ? '#F5A623' : 'rgba(255,255,255,0.15)';
      });
    }
    function shakeAndReset(msg) {
      error.textContent = msg;
      dotsWrap.classList.remove('pf-shake');
      void dotsWrap.offsetWidth;
      dotsWrap.classList.add('pf-shake');
      entered = '';
      setTimeout(renderDots, 120);
    }
    function advance() {
      if (stepIndex === 0) {
        if (entered !== currentPin) { shakeAndReset('Incorrect PIN'); return; }
        stepIndex = 1; entered = ''; label.textContent = steps[1]; error.textContent = '';
      } else if (stepIndex === 1) {
        newPin = entered;
        stepIndex = 2; entered = ''; label.textContent = steps[2]; error.textContent = '';
      } else if (stepIndex === 2) {
        if (entered !== newPin) { shakeAndReset("PINs don't match — try again"); stepIndex = 1; newPin = ''; label.textContent = steps[1]; return; }
        keypad.style.display = 'none';
        dotsWrap.style.display = 'none';
        document.getElementById('pf-cp-progress-0').parentElement.style.display = 'none';
        label.style.display = 'none';
        success.style.display = 'block';
        return;
      }
      renderDots();
      renderProgress();
    }

    keypad.addEventListener('click', function (e) {
      var btn = e.target.closest('.pf-key');
      if (!btn) return;
      var k = btn.getAttribute('data-k');
      if (k === 'back') { entered = entered.slice(0, -1); renderDots(); return; }
      if (entered.length >= 4) return;
      entered += k;
      renderDots();
      if (entered.length === 4) setTimeout(advance, 220);
    });
  }
}
</script>
</body>
</html>
