<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: #F5A623; }
    a:hover { color: #ffb733; }
    .icon { display: block; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .pf-fade { opacity: 0; animation: pfFadeUp .4s cubic-bezier(.22,1,.36,1) both; }
    @keyframes pfFadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pfSheetUp { from { opacity: 0; transform: translateY(28px); } to { opacity: 1; transform: translateY(0); } }
    .pf-sheet { animation: pfSheetUp .38s cubic-bezier(.22,1,.36,1) both; }
    .pf-chip:active { transform: scale(0.95); }
    .pf-cta:active { transform: scale(0.97); }
    @keyframes pfCopiedIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    .pf-copied { animation: pfCopiedIn .2s ease both; }
  </style>
</helmet>

<div style="position:relative; width:390px; height:800px; overflow:hidden; background:#0D1B2A; border-radius:38px; border:1px solid rgba(255,255,255,0.08); font-family:'Inter',sans-serif; color:#EDEFF2;">

  <div class="pf-fade" style="padding:28px 20px 0; opacity:0.28; filter:blur(1.5px); animation-delay:0s;">
    <div style="font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:20px;">Menu</div>
  </div>
  <div style="position:absolute; inset:0; background:rgba(5,10,18,0.55);"></div>

  <div class="pf-sheet" style="position:absolute; left:0; right:0; bottom:0; max-height:92%; overflow-y:auto; background:linear-gradient(180deg, rgba(20,42,66,0.97), rgba(13,27,42,0.99)); border-top:1px solid rgba(255,255,255,0.14); border-radius:26px 26px 0 0; box-shadow:0 -20px 50px -20px rgba(0,0,0,0.7); padding:12px 22px calc(22px + env(safe-area-inset-bottom, 0px));">

    <div style="width:36px; height:4px; border-radius:3px; background:rgba(255,255,255,0.18); margin:0 auto 16px;"></div>

    <div style="display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:16px;">
      <div>
        <div style="font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:19px;">Share Fund Status</div>
        <div style="font-size:12px; color:#93A2B8; margin-top:2px;">Paste this into your group chat</div>
      </div>
      <button class="pf-chip" style="width:32px; height:32px; border-radius:50%; background:rgba(255,255,255,0.08); border:none; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;">
        <svg class="icon" viewBox="0 0 24 24" style="width:15px; height:15px; color:#EDEFF2;"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
      </button>
    </div>

    <textarea id="pf-share-text" readonly style="width:100%; min-height:220px; padding:14px; border-radius:14px; background:rgba(20,42,66,0.5); border:1.5px solid rgba(255,255,255,0.14); color:#EDEFF2; font-family:'Inter',sans-serif; font-size:13px; line-height:1.7; white-space:pre-wrap; resize:vertical; margin-bottom:8px;">Power Fund &mdash; ViTAMiN Fund 2027
Round 2 of 5 &middot; Collecting
₱18,000 of ₱30,000 &middot; ₱12,000 to go

✅ Paid: Ana, Ben
🟣 Pending review: Cathy
🔴 Overdue: Dan
⏰ Not yet due: Elena

Round 1: ✅ Completed &middot; paid to Ana</textarea>

    <div id="pf-copied-msg" class="pf-copied" style="display:none; font-size:12px; color:#4CAF83; text-align:center; margin-bottom:10px;">Copied to clipboard</div>

    <button id="pf-copy-btn" class="pf-cta" style="width:100%; height:52px; border:none; border-radius:16px; background:linear-gradient(135deg, #F5A623, #FFC966); color:#14213D; font-family:'Inter',sans-serif; font-weight:700; font-size:14.5px; cursor:pointer; box-shadow:0 12px 22px -10px rgba(245,166,35,0.5); display:flex; align-items:center; justify-content:center; gap:8px; transition:transform .1s ease; margin-top:8px;">
      <svg class="icon" viewBox="0 0 24 24" style="width:16px; height:16px; stroke-width:2.2;"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
      Copy to Clipboard
    </button>
    <button class="pf-chip" style="width:100%; text-align:center; background:none; border:none; color:#93A2B8; font-family:'Inter',sans-serif; font-size:13px; font-weight:600; cursor:pointer; padding:12px 0 2px;">Close</button>
  </div>

</div>
</x-dc>
<script data-dc-script>
class Component extends DCLogic {
  componentDidMount() {
    var btn = document.getElementById('pf-copy-btn');
    var msg = document.getElementById('pf-copied-msg');
    var textarea = document.getElementById('pf-share-text');
    var timer = null;
    if (btn) btn.addEventListener('click', function () {
      try { textarea.select(); } catch (e) {}
      msg.style.display = 'block';
      msg.style.animation = 'none';
      void msg.offsetWidth;
      msg.style.animation = 'pfCopiedIn .2s ease both';
      if (timer) clearTimeout(timer);
      timer = setTimeout(function () { msg.style.display = 'none'; }, 2200);
    });
  }
}
</script>
</body>
</html>
