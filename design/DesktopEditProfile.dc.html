<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    .icon { display: block; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .pf-modal { opacity: 0; animation: pfModalIn .32s cubic-bezier(.22,1,.36,1) both; }
    @keyframes pfModalIn { from { opacity: 0; transform: translate(-50%,-50%) translateY(10px) scale(0.98); } to { opacity: 1; transform: translate(-50%,-50%) translateY(0) scale(1); } }
    .pf-x:hover { background: rgba(255,255,255,0.08) !important; }
    input { font-family:'Inter',sans-serif; }
  </style>
</helmet>

<div style="position:relative; width:1440px; height:900px; overflow:hidden; background:#0D1B2A; border-radius:16px; border:1px solid rgba(255,255,255,0.08); font-family:'Inter',sans-serif; color:#EDEFF2;">

  <div style="opacity:0.35; filter:blur(1.5px); display:flex; height:100%;">
    <div style="width:240px; height:100%; background:rgba(255,255,255,0.02); border-right:1px solid rgba(255,255,255,0.08);"></div>
    <div style="flex:1; padding:32px 40px;"><div style="font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:24px;">Menu</div></div>
  </div>
  <div style="position:absolute; inset:0; background:rgba(5,10,18,0.6);"></div>

  <div class="pf-modal" style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:460px; background:linear-gradient(180deg, rgba(20,42,66,0.98), rgba(13,27,42,0.99)); border:1px solid rgba(255,255,255,0.12); border-radius:22px; box-shadow:0 30px 80px -20px rgba(0,0,0,0.7); padding:30px 32px;">

    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:22px;">
      <div style="font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:18px;">Edit profile</div>
      <button class="pf-x" style="width:32px; height:32px; border-radius:9px; background:none; border:none; display:flex; align-items:center; justify-content:center; cursor:pointer;">
        <svg class="icon" viewBox="0 0 24 24" style="width:16px; height:16px; color:#93A2B8;"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <div style="display:flex; justify-content:center; margin-bottom:24px;">
      <button style="position:relative; width:84px; height:84px; border-radius:50%; background:#1B3A57; border:none; display:flex; align-items:center; justify-content:center; font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:28px; box-shadow:0 0 0 3px #9B7FE0; cursor:pointer;">
        C
        <span style="position:absolute; bottom:0; right:0; width:28px; height:28px; border-radius:50%; background:#F5A623; border:3px solid #14213D; display:flex; align-items:center; justify-content:center;">
          <svg class="icon" viewBox="0 0 24 24" style="width:13px; height:13px; color:#14213D; stroke-width:2.6;"><path d="M4 8h3l1.6-2.4A2 2 0 0 1 10.3 4.6h3.4a2 2 0 0 1 1.7 1L17 8h3a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-9a2 2 0 0 1 2-2Z"/><circle cx="12" cy="14" r="3.6"/></svg>
        </span>
      </button>
    </div>

    <label style="font-size:11px; color:#93A2B8; text-transform:uppercase; letter-spacing:.05em; display:block; margin-bottom:6px;">Display name</label>
    <input id="pf-name-input" type="text" value="Cathy" style="width:100%; height:48px; border-radius:12px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.14); color:#EDEFF2; font-size:14px; padding:0 14px; margin-bottom:8px;">
    <div id="pf-name-hint" style="font-size:11.5px; color:#93A2B8; margin-bottom:22px;">Visible to the rest of the group</div>

    <button id="pf-save-btn" style="width:100%; height:50px; border:none; border-radius:15px; background:linear-gradient(135deg,#F5A623,#e0951d); color:#14213D; font-family:'Inter',sans-serif; font-weight:700; font-size:14px; cursor:pointer;">Save changes</button>
  </div>

</div>
</x-dc>
<script data-dc-script>
class Component extends DCLogic {
  componentDidMount() {
    var input = document.getElementById('pf-name-input');
    var hint = document.getElementById('pf-name-hint');
    var save = document.getElementById('pf-save-btn');
    var taken = ['ana', 'ben', 'dan', 'elena'];
    function check() {
      var v = input.value.trim();
      if (!v) { hint.textContent = 'Name cannot be empty'; hint.style.color = '#E15353'; save.disabled = true; save.style.opacity = '0.5'; return; }
      if (taken.indexOf(v.toLowerCase()) !== -1) { hint.textContent = 'That name is already taken'; hint.style.color = '#E15353'; save.disabled = true; save.style.opacity = '0.5'; return; }
      hint.textContent = 'Visible to the rest of the group'; hint.style.color = '#93A2B8'; save.disabled = false; save.style.opacity = '1';
    }
    if (input) input.addEventListener('input', check);
  }
}
</script>
</body>
</html>
