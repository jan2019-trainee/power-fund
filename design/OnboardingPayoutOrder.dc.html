<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: #F5A623; }
    a:hover { color: #ffb733; }
    .icon { display: block; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .pf-fade { opacity: 0; animation: pfFadeUp .5s cubic-bezier(.22,1,.36,1) both; }
    @keyframes pfFadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pfDrift1 { 0%, 100% { transform: translate(-8%, -6%) scale(1); } 50% { transform: translate(6%, 4%) scale(1.1); } }
    .pf-cta:active { transform: scale(0.97); }
    .pf-skip:active { opacity: 0.6; }
    @media (prefers-reduced-motion: reduce) {
      .pf-fade { animation: none; opacity: 1; }
      .pf-glow1 { animation: none; }
    }
  </style>
</helmet>

<div style="position:relative; width:390px; height:844px; overflow:hidden; background:#0D1B2A; border-radius:38px; border:1px solid rgba(255,255,255,0.08); font-family:'Inter',sans-serif; color:#EDEFF2;">

  <div class="pf-glow1" style="position:absolute; top:20px; left:50%; margin-left:-170px; width:340px; height:340px; border-radius:50%; background:radial-gradient(circle, rgba(155,127,224,0.2), transparent 70%); filter:blur(36px); animation:pfDrift1 17s ease-in-out infinite;"></div>

  <div style="position:relative; z-index:1; height:100%; padding:20px 32px 32px; display:flex; flex-direction:column;">

    <div style="display:flex; justify-content:flex-end;">
      <button class="pf-skip" style="background:none; border:none; color:#93A2B8; font-family:'Inter',sans-serif; font-size:13px; font-weight:600; cursor:pointer; padding:8px;">Skip</button>
    </div>

    <div class="pf-fade" style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; animation-delay:.05s;">

      <div style="width:96px; height:96px; border-radius:50%; background:linear-gradient(160deg, rgba(155,127,224,0.22), rgba(245,166,35,0.1)); border:1px solid rgba(255,255,255,0.14); display:flex; align-items:center; justify-content:center; box-shadow:0 0 46px -10px rgba(155,127,224,0.4); margin-bottom:22px;">
        <svg class="icon" viewBox="0 0 24 24" style="width:40px; height:40px; stroke-width:1.7; color:#9B7FE0;">
          <circle cx="9" cy="8" r="3.2"/>
          <path d="M2.8 20.2c.5-3.6 3-5.6 6.2-5.6s5.7 2 6.2 5.6"/>
          <circle cx="17.3" cy="8.6" r="2.4"/>
          <path d="M15.9 14.3c2.3.5 4 2.3 4.3 5.4"/>
        </svg>
      </div>

      <div style="font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:24px; letter-spacing:-.3px; margin-bottom:10px; max-width:280px;">Everyone gets a turn</div>
      <div style="font-size:15px; line-height:1.6; color:#93A2B8; max-width:280px; margin-bottom:20px;">Each round, the full &#8369;30,000 goes to one member &mdash; in a fixed order. Once your round is funded, it's yours.</div>

      <div style="width:100%; padding:12px; border-radius:16px; background:rgba(20,42,66,0.5); border:1px solid rgba(255,255,255,0.1); display:flex; flex-direction:column; gap:6px; text-align:left;">

        <div style="display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:10px;">
          <div style="width:32px; height:32px; border-radius:50%; background:#1B3A57; display:flex; align-items:center; justify-content:center; font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:13px; flex-shrink:0; box-shadow:0 0 0 2px #4CAF83;">A</div>
          <span style="flex:1; font-size:13px; font-weight:600;">Ana</span>
          <span style="font-size:11px; color:#4CAF83; font-weight:600;">Paid out</span>
        </div>

        <div style="display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:10px; background:rgba(245,166,35,0.12); border:1px solid rgba(245,166,35,0.4);">
          <div style="width:32px; height:32px; border-radius:50%; background:#1B3A57; display:flex; align-items:center; justify-content:center; font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:13px; flex-shrink:0; box-shadow:0 0 0 2px #F5A623;">B</div>
          <span style="flex:1; font-size:13px; font-weight:600;">Ben</span>
          <span style="font-size:10.5px; color:#F5A623; font-weight:700; background:rgba(245,166,35,0.18); padding:2px 8px; border-radius:20px;">This round</span>
        </div>

        <div style="display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:10px;">
          <div style="width:32px; height:32px; border-radius:50%; background:#1B3A57; display:flex; align-items:center; justify-content:center; font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:13px; flex-shrink:0; box-shadow:0 0 0 1.5px rgba(255,255,255,0.14); color:#93A2B8;">C</div>
          <span style="flex:1; font-size:13px; color:#93A2B8;">Cathy</span>
          <span style="font-size:11px; color:#93A2B8;">Upcoming</span>
        </div>

        <div style="display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:10px;">
          <div style="width:32px; height:32px; border-radius:50%; background:#1B3A57; display:flex; align-items:center; justify-content:center; font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:13px; flex-shrink:0; box-shadow:0 0 0 1.5px rgba(255,255,255,0.14); color:#93A2B8;">D</div>
          <span style="flex:1; font-size:13px; color:#93A2B8;">Dan</span>
          <span style="font-size:11px; color:#93A2B8;">Upcoming</span>
        </div>

        <div style="display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:10px;">
          <div style="width:32px; height:32px; border-radius:50%; background:#1B3A57; display:flex; align-items:center; justify-content:center; font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:13px; flex-shrink:0; box-shadow:0 0 0 1.5px rgba(255,255,255,0.14); color:#93A2B8;">E</div>
          <span style="flex:1; font-size:13px; color:#93A2B8;">Elena</span>
          <span style="font-size:11px; color:#93A2B8;">Upcoming</span>
        </div>
      </div>
    </div>

    <div class="pf-fade" style="animation-delay:.12s;">
      <div style="display:flex; gap:8px; justify-content:center; margin-bottom:20px;">
        <span style="width:6px; height:6px; border-radius:50%; background:rgba(255,255,255,0.18);"></span>
        <span style="width:6px; height:6px; border-radius:50%; background:rgba(255,255,255,0.18);"></span>
        <span style="width:22px; height:6px; border-radius:3px; background:#F5A623;"></span>
        <span style="width:6px; height:6px; border-radius:50%; background:rgba(255,255,255,0.18);"></span>
        <span style="width:6px; height:6px; border-radius:50%; background:rgba(255,255,255,0.18);"></span>
      </div>
      <button class="pf-cta" style="width:100%; height:56px; border:none; border-radius:28px; background:linear-gradient(135deg, #F5A623, #FFC966); color:#14213D; font-family:'Inter',sans-serif; font-weight:700; font-size:15px; cursor:pointer; box-shadow:0 14px 26px -10px rgba(245,166,35,0.55), 0 0 0 1px rgba(255,255,255,0.1) inset; transition:transform .1s ease;">Next</button>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
