<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: #F5A623; }
    a:hover { color: #ffb733; }
    .icon { display: block; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .pf-fade { opacity: 0; animation: pfFadeUp .5s cubic-bezier(.22,1,.36,1) both; }
    @keyframes pfFadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pfDrift1 { 0%, 100% { transform: translate(-8%, -6%) scale(1); } 50% { transform: translate(6%, 4%) scale(1.1); } }
    .pf-cta:active { transform: scale(0.97); }
    .pf-skip:active { opacity: 0.6; }
    @media (prefers-reduced-motion: reduce) {
      .pf-fade { animation: none; opacity: 1; }
      .pf-glow1 { animation: none; }
    }
  </style>
</helmet>

<div style="position:relative; width:390px; height:844px; overflow:hidden; background:#0D1B2A; border-radius:38px; border:1px solid rgba(255,255,255,0.08); font-family:'Inter',sans-serif; color:#EDEFF2;">

  <div class="pf-glow1" style="position:absolute; top:60px; left:50%; margin-left:-170px; width:340px; height:340px; border-radius:50%; background:radial-gradient(circle, rgba(245,166,35,0.22), transparent 70%); filter:blur(36px); animation:pfDrift1 17s ease-in-out infinite;"></div>

  <div style="position:relative; z-index:1; height:100%; padding:20px 32px 32px; display:flex; flex-direction:column;">

    <div style="display:flex; justify-content:flex-end;">
      <button class="pf-skip" style="background:none; border:none; color:#93A2B8; font-family:'Inter',sans-serif; font-size:13px; font-weight:600; cursor:pointer; padding:8px;">Skip</button>
    </div>

    <div class="pf-fade" style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; animation-delay:.05s;">

      <div style="width:96px; height:96px; border-radius:50%; background:linear-gradient(160deg, rgba(245,166,35,0.2), rgba(76,217,192,0.14)); border:1px solid rgba(255,255,255,0.14); display:flex; align-items:center; justify-content:center; box-shadow:0 0 46px -10px rgba(245,166,35,0.4); margin-bottom:26px;">
        <svg class="icon" viewBox="0 0 24 24" style="width:40px; height:40px; stroke-width:1.7; color:#F5A623;">
          <path d="M4 8V5a1 1 0 0 1 1-1h3"/>
          <path d="M16 4h3a1 1 0 0 1 1 1v3"/>
          <path d="M20 16v3a1 1 0 0 1-1 1h-3"/>
          <path d="M8 20H5a1 1 0 0 1-1-1v-3"/>
          <rect x="9" y="9" width="2.6" height="2.6" fill="currentColor" stroke="none"/>
          <rect x="13.4" y="9" width="1.6" height="1.6" fill="currentColor" stroke="none"/>
          <rect x="9" y="13.4" width="1.6" height="1.6" fill="currentColor" stroke="none"/>
          <rect x="13.4" y="13.4" width="2.6" height="2.6" fill="currentColor" stroke="none"/>
        </svg>
      </div>

      <div style="font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:24px; letter-spacing:-.3px; margin-bottom:10px;">Paying is simple</div>
      <div style="font-size:15px; line-height:1.6; color:#93A2B8; max-width:280px; margin-bottom:28px;">Scan the treasurer's GCash QR, send &#8369;1,000, then upload your screenshot as proof. The treasurer verifies it and you're marked paid.</div>

      <div style="display:flex; align-items:flex-start; gap:6px; width:100%;">

        <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:8px;">
          <div style="width:44px; height:44px; border-radius:12px; background:rgba(245,166,35,0.14); border:1px solid rgba(245,166,35,0.3); display:flex; align-items:center; justify-content:center;">
            <svg class="icon" viewBox="0 0 24 24" style="width:20px; height:20px; color:#F5A623;">
              <path d="M4 8V5a1 1 0 0 1 1-1h3"/><path d="M16 4h3a1 1 0 0 1 1 1v3"/><path d="M20 16v3a1 1 0 0 1-1 1h-3"/><path d="M8 20H5a1 1 0 0 1-1-1v-3"/>
              <rect x="10" y="10" width="4" height="4" fill="currentColor" stroke="none"/>
            </svg>
          </div>
          <span style="font-size:11px; color:#93A2B8; text-align:center; line-height:1.4;">Scan &amp; pay</span>
        </div>

        <svg class="icon" viewBox="0 0 24 24" style="width:16px; height:16px; color:rgba(255,255,255,0.25); margin-top:14px; flex-shrink:0;"><line x1="4" y1="12" x2="20" y2="12"/><polyline points="14 6 20 12 14 18"/></svg>

        <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:8px;">
          <div style="width:44px; height:44px; border-radius:12px; background:rgba(155,127,224,0.14); border:1px solid rgba(155,127,224,0.3); display:flex; align-items:center; justify-content:center;">
            <svg class="icon" viewBox="0 0 24 24" style="width:20px; height:20px; color:#9B7FE0;">
              <path d="M4 8h3l1.6-2.4A2 2 0 0 1 10.3 4.6h3.4a2 2 0 0 1 1.7 1L17 8h3a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-9a2 2 0 0 1 2-2Z"/>
              <circle cx="12" cy="14" r="3.6"/>
            </svg>
          </div>
          <span style="font-size:11px; color:#93A2B8; text-align:center; line-height:1.4;">Upload proof</span>
        </div>

        <svg class="icon" viewBox="0 0 24 24" style="width:16px; height:16px; color:rgba(255,255,255,0.25); margin-top:14px; flex-shrink:0;"><line x1="4" y1="12" x2="20" y2="12"/><polyline points="14 6 20 12 14 18"/></svg>

        <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:8px;">
          <div style="width:44px; height:44px; border-radius:12px; background:rgba(76,175,131,0.14); border:1px solid rgba(76,175,131,0.3); display:flex; align-items:center; justify-content:center;">
            <svg class="icon" viewBox="0 0 24 24" style="width:20px; height:20px; color:#4CAF83; stroke-width:2.6;"><polyline points="4 12 10 18 20 6"/></svg>
          </div>
          <span style="font-size:11px; color:#93A2B8; text-align:center; line-height:1.4;">Confirmed</span>
        </div>
      </div>
    </div>

    <div class="pf-fade" style="animation-delay:.12s;">
      <div style="display:flex; gap:8px; justify-content:center; margin-bottom:20px;">
        <span style="width:6px; height:6px; border-radius:50%; background:rgba(255,255,255,0.18);"></span>
        <span style="width:6px; height:6px; border-radius:50%; background:rgba(255,255,255,0.18);"></span>
        <span style="width:6px; height:6px; border-radius:50%; background:rgba(255,255,255,0.18);"></span>
        <span style="width:22px; height:6px; border-radius:3px; background:#F5A623;"></span>
        <span style="width:6px; height:6px; border-radius:50%; background:rgba(255,255,255,0.18);"></span>
      </div>
      <button class="pf-cta" style="width:100%; height:56px; border:none; border-radius:28px; background:linear-gradient(135deg, #F5A623, #FFC966); color:#14213D; font-family:'Inter',sans-serif; font-weight:700; font-size:15px; cursor:pointer; box-shadow:0 14px 26px -10px rgba(245,166,35,0.55), 0 0 0 1px rgba(255,255,255,0.1) inset; transition:transform .1s ease;">Next</button>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
