<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    .icon { display: block; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .pf-modal { opacity: 0; animation: pfModalIn .32s cubic-bezier(.22,1,.36,1) both; }
    @keyframes pfModalIn { from { opacity: 0; transform: translate(-50%,-50%) translateY(10px) scale(0.98); } to { opacity: 1; transform: translate(-50%,-50%) translateY(0) scale(1); } }
    .pf-x:hover { background: rgba(255,255,255,0.08) !important; }
    .pf-row:hover { background: rgba(255,255,255,0.06) !important; }
  </style>
</helmet>

<div style="position:relative; width:1440px; height:900px; overflow:hidden; background:#0D1B2A; border-radius:16px; border:1px solid rgba(255,255,255,0.08); font-family:'Inter',sans-serif; color:#EDEFF2;">

  <div style="opacity:0.35; filter:blur(1.5px); display:flex; height:100%;">
    <div style="width:240px; height:100%; background:rgba(255,255,255,0.02); border-right:1px solid rgba(255,255,255,0.08);"></div>
    <div style="flex:1; padding:32px 40px;"><div style="font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:24px;">Menu</div></div>
  </div>
  <div style="position:absolute; inset:0; background:rgba(5,10,18,0.6);"></div>

  <div class="pf-modal" style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:420px; background:linear-gradient(180deg, rgba(20,42,66,0.98), rgba(13,27,42,0.99)); border:1px solid rgba(255,255,255,0.12); border-radius:22px; box-shadow:0 30px 80px -20px rgba(0,0,0,0.7); padding:28px 30px;">

    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:20px;">
      <div style="font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:17px;">Change photo</div>
      <button class="pf-x" style="width:32px; height:32px; border-radius:9px; background:none; border:none; display:flex; align-items:center; justify-content:center; cursor:pointer;">
        <svg class="icon" viewBox="0 0 24 24" style="width:16px; height:16px; color:#93A2B8;"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <div style="border-radius:16px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.1); overflow:hidden; margin-bottom:10px;">
      <button class="pf-row" style="width:100%; display:flex; align-items:center; gap:12px; padding:14px; background:none; border:none; border-bottom:1px solid rgba(255,255,255,0.06); cursor:pointer; text-align:left;">
        <div style="width:36px; height:36px; border-radius:10px; background:rgba(76,217,192,0.14); display:flex; align-items:center; justify-content:center; flex-shrink:0;">
          <svg class="icon" viewBox="0 0 24 24" style="width:17px; height:17px; color:#4CD9C0;"><path d="M12 3v12"/><polyline points="7 8 12 3 17 8"/><path d="M5 15v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4"/></svg>
        </div>
        <span style="flex:1; font-size:14px; font-weight:500; color:#EDEFF2;">Upload from Computer</span>
      </button>
      <button class="pf-row" style="width:100%; display:flex; align-items:center; gap:12px; padding:14px; background:none; border:none; cursor:pointer; text-align:left;">
        <div style="width:36px; height:36px; border-radius:10px; background:rgba(245,166,35,0.14); display:flex; align-items:center; justify-content:center; flex-shrink:0;">
          <svg class="icon" viewBox="0 0 24 24" style="width:17px; height:17px; color:#F5A623;"><path d="M4 8h3l1.6-2.4A2 2 0 0 1 10.3 4.6h3.4a2 2 0 0 1 1.7 1L17 8h3a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-9a2 2 0 0 1 2-2Z"/><circle cx="12" cy="14" r="3.6"/></svg>
        </div>
        <span style="flex:1; font-size:14px; font-weight:500; color:#EDEFF2;">Use Webcam</span>
      </button>
    </div>

    <button class="pf-row" style="width:100%; display:flex; align-items:center; gap:12px; padding:14px; border-radius:16px; background:rgba(225,83,83,0.06); border:1px solid rgba(225,83,83,0.25); cursor:pointer; text-align:left;">
      <div style="width:36px; height:36px; border-radius:10px; background:rgba(225,83,83,0.14); display:flex; align-items:center; justify-content:center; flex-shrink:0;">
        <svg class="icon" viewBox="0 0 24 24" style="width:17px; height:17px; color:#E15353;"><path d="M4 7h16"/><path d="M10 11v6M14 11v6"/><path d="M6 7l1 13a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-13"/><path d="M9 7V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v3"/></svg>
      </div>
      <span style="flex:1; font-size:14px; font-weight:600; color:#E15353;">Remove Photo</span>
    </button>
  </div>

</div>
</x-dc>
</body>
</html>
