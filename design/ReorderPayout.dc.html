<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: #F5A623; }
    a:hover { color: #ffb733; }
    .icon { display: block; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .pf-fade { opacity: 0; animation: pfFadeUp .4s cubic-bezier(.22,1,.36,1) both; }
    @keyframes pfFadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pfSheetUp { from { opacity: 0; transform: translateY(28px); } to { opacity: 1; transform: translateY(0); } }
    .pf-sheet { animation: pfSheetUp .38s cubic-bezier(.22,1,.36,1) both; }
    .pf-chip:active { transform: scale(0.95); }
    .pf-arrow:not(:disabled):active { transform: scale(0.9); }
    .pf-arrow:disabled { opacity: 0.25; cursor: default; }
    @keyframes pfRowSwap { from { opacity: 0.3; } to { opacity: 1; } }
    .pf-row-swapped { animation: pfRowSwap .25s ease; }
  </style>
</helmet>

<div style="position:relative; width:390px; height:760px; overflow:hidden; background:#0D1B2A; border-radius:38px; border:1px solid rgba(255,255,255,0.08); font-family:'Inter',sans-serif; color:#EDEFF2;">

  <!-- dimmed backdrop hint -->
  <div class="pf-fade" style="padding:28px 20px 0; opacity:0.28; filter:blur(1.5px); animation-delay:0s;">
    <div style="font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:20px;">Menu</div>
  </div>
  <div style="position:absolute; inset:0; background:rgba(5,10,18,0.55);"></div>

  <!-- bottom sheet -->
  <div class="pf-sheet" style="position:absolute; left:0; right:0; bottom:0; background:linear-gradient(180deg, rgba(20,42,66,0.97), rgba(13,27,42,0.99)); border-top:1px solid rgba(255,255,255,0.14); border-radius:26px 26px 0 0; box-shadow:0 -20px 50px -20px rgba(0,0,0,0.7); padding:12px 22px calc(22px + env(safe-area-inset-bottom, 0px));">

    <div style="width:36px; height:4px; border-radius:3px; background:rgba(255,255,255,0.18); margin:0 auto 16px;"></div>

    <div style="display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:6px;">
      <div style="font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:19px;">Reorder Payout Order</div>
      <button class="pf-chip" style="width:32px; height:32px; border-radius:50%; background:rgba(255,255,255,0.08); border:none; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;">
        <svg class="icon" viewBox="0 0 24 24" style="width:15px; height:15px; color:#EDEFF2;"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
      </button>
    </div>
    <div style="font-size:12.5px; color:#93A2B8; margin-bottom:18px;">Round N always pays whoever is in position N.</div>

    <div id="pf-order-list" style="display:flex; flex-direction:column; gap:8px; margin-bottom:6px;"></div>

    <div style="font-size:11px; color:#93A2B8; text-align:center; margin-top:14px;">Changes apply immediately &mdash; no separate save step, matching the app's existing behavior.</div>
  </div>

</div>
</x-dc>
<script data-dc-script>
class Component extends DCLogic {
  componentDidMount() {
    var members = [
      { initial: 'A', name: 'Ana', ring: '#4CAF83' },
      { initial: 'B', name: 'Ben', ring: '#F5A623' },
      { initial: 'C', name: 'Cathy', ring: '#9B7FE0' },
      { initial: 'D', name: 'Dan', ring: '#E15353' },
      { initial: 'E', name: 'Elena', ring: 'rgba(255,255,255,0.14)' }
    ];
    var list = document.getElementById('pf-order-list');

    function render(swappedIdx) {
      list.innerHTML = '';
      members.forEach(function (m, i) {
        var row = document.createElement('div');
        row.className = (swappedIdx && (i === swappedIdx[0] || i === swappedIdx[1])) ? 'pf-row-swapped' : '';
        row.style.cssText = 'display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:14px; background:rgba(20,42,66,0.5); border:1px solid rgba(255,255,255,0.1);';
        row.innerHTML =
          '<span style="width:20px; font-family:\'Space Grotesk\',sans-serif; font-size:12px; font-weight:700; color:#93A2B8; flex-shrink:0;">' + (i + 1) + '</span>' +
          '<div style="width:34px; height:34px; border-radius:50%; background:#1B3A57; display:flex; align-items:center; justify-content:center; font-family:\'Space Grotesk\',sans-serif; font-weight:600; font-size:13px; box-shadow:0 0 0 2px ' + m.ring + '; flex-shrink:0; color:#EDEFF2;">' + m.initial + '</div>' +
          '<span style="flex:1; font-size:14px; font-weight:600; color:#EDEFF2;">' + m.name + '</span>';

        var arrows = document.createElement('div');
        arrows.style.cssText = 'display:flex; gap:6px; flex-shrink:0;';

        var up = document.createElement('button');
        up.className = 'pf-arrow';
        up.style.cssText = 'width:30px; height:30px; border-radius:8px; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.12); color:#EDEFF2; display:flex; align-items:center; justify-content:center; cursor:pointer;';
        up.innerHTML = '<svg viewBox="0 0 24 24" style="width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;"><polyline points="18 15 12 9 6 15"/></svg>';
        up.disabled = i === 0;
        up.addEventListener('click', function () {
          var tmp = members[i - 1]; members[i - 1] = members[i]; members[i] = tmp;
          render([i - 1, i]);
        });

        var down = document.createElement('button');
        down.className = 'pf-arrow';
        down.style.cssText = up.style.cssText;
        down.innerHTML = '<svg viewBox="0 0 24 24" style="width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;"><polyline points="6 9 12 15 18 9"/></svg>';
        down.disabled = i === members.length - 1;
        down.addEventListener('click', function () {
          var tmp = members[i + 1]; members[i + 1] = members[i]; members[i] = tmp;
          render([i, i + 1]);
        });

        arrows.appendChild(up);
        arrows.appendChild(down);
        row.appendChild(arrows);
        list.appendChild(row);
      });
    }
    render();
  }
}
</script>
</body>
</html>
