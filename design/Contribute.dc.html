<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: #F5A623; }
    a:hover { color: #ffb733; }
    .icon { display: block; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .pf-fade { opacity: 0; animation: pfFadeUp .4s cubic-bezier(.22,1,.36,1) both; }
    @keyframes pfFadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pfSheetUp { from { opacity: 0; transform: translateY(28px); } to { opacity: 1; transform: translateY(0); } }
    .pf-sheet { animation: pfSheetUp .38s cubic-bezier(.22,1,.36,1) both; }
    .pf-cta:active { transform: scale(0.97); }
    .pf-chip:active { transform: scale(0.95); }
    @media (prefers-reduced-motion: reduce) {
      .pf-fade, .pf-sheet { animation: none; opacity: 1; }
    }
  </style>
</helmet>

<div style="position:relative; width:390px; height:900px; overflow:hidden; background:#0D1B2A; border-radius:38px; border:1px solid rgba(255,255,255,0.08); font-family:'Inter',sans-serif; color:#EDEFF2;">

  <!-- dimmed backdrop hint: a faint suggestion of Home behind the sheet -->
  <div class="pf-fade" style="padding:28px 20px 0; opacity:0.28; filter:blur(1.5px); animation-delay:0s;">
    <div style="font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:20px; margin-bottom:14px;">Power Fund</div>
    <div style="height:140px; border-radius:24px; background:rgba(20,42,66,0.6); border:1px solid rgba(255,255,255,0.1);"></div>
  </div>
  <div style="position:absolute; inset:0; background:rgba(5,10,18,0.55);"></div>

  <!-- bottom sheet -->
  <div class="pf-sheet" style="position:absolute; left:0; right:0; bottom:0; max-height:88%; overflow-y:auto; background:linear-gradient(180deg, rgba(20,42,66,0.97), rgba(13,27,42,0.99)); border-top:1px solid rgba(255,255,255,0.14); border-radius:26px 26px 0 0; box-shadow:0 -20px 50px -20px rgba(0,0,0,0.7); padding:12px 22px calc(22px + env(safe-area-inset-bottom, 0px));">

    <div style="width:36px; height:4px; border-radius:3px; background:rgba(255,255,255,0.18); margin:0 auto 16px;"></div>

    <div style="display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:4px;">
      <div>
        <div style="font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:19px;">Pay Cycle 7</div>
        <div style="font-size:12.5px; color:#93A2B8; margin-top:2px;">Due Sep 1 &middot; Round 2</div>
      </div>
      <button class="pf-chip" style="width:32px; height:32px; border-radius:50%; background:rgba(255,255,255,0.08); border:none; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;">
        <svg class="icon" viewBox="0 0 24 24" style="width:15px; height:15px; color:#EDEFF2;"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
      </button>
    </div>

    <!-- QR — tappable, opens a full-screen zoom (real interaction, try it) -->
    <div style="margin-top:16px; padding:16px; border-radius:18px; background:#fff; display:flex; flex-direction:column; align-items:center;">
    <button id="pf-qr-open" class="pf-chip" style="position:relative; display:flex; flex-direction:column; align-items:center; width:100%; background:none; padding:0; border:none; cursor:zoom-in;">
      <svg viewBox="0 0 100 100" style="width:148px; height:148px;">
        <rect x="6" y="6" width="18" height="18" fill="none" stroke="#0D1B2A" stroke-width="4"/><rect x="12" y="12" width="6" height="6" fill="#0D1B2A"/>
        <rect x="76" y="6" width="18" height="18" fill="none" stroke="#0D1B2A" stroke-width="4"/><rect x="82" y="12" width="6" height="6" fill="#0D1B2A"/>
        <rect x="6" y="76" width="18" height="18" fill="none" stroke="#0D1B2A" stroke-width="4"/><rect x="12" y="82" width="6" height="6" fill="#0D1B2A"/>
        <rect x="34" y="10" width="5" height="5" fill="#0D1B2A"/><rect x="44" y="10" width="5" height="5" fill="#0D1B2A"/><rect x="54" y="16" width="5" height="5" fill="#0D1B2A"/>
        <rect x="34" y="22" width="5" height="5" fill="#0D1B2A"/><rect x="60" y="28" width="5" height="5" fill="#0D1B2A"/><rect x="40" y="34" width="5" height="5" fill="#0D1B2A"/>
        <rect x="50" y="40" width="5" height="5" fill="#0D1B2A"/><rect x="66" y="40" width="5" height="5" fill="#0D1B2A"/><rect x="30" y="46" width="5" height="5" fill="#0D1B2A"/>
        <rect x="58" y="50" width="5" height="5" fill="#0D1B2A"/><rect x="70" y="54" width="5" height="5" fill="#0D1B2A"/><rect x="40" y="58" width="5" height="5" fill="#0D1B2A"/>
        <rect x="34" y="66" width="5" height="5" fill="#0D1B2A"/><rect x="46" y="70" width="5" height="5" fill="#0D1B2A"/><rect x="60" y="66" width="5" height="5" fill="#0D1B2A"/>
        <rect x="76" y="34" width="5" height="5" fill="#0D1B2A"/><rect x="86" y="44" width="5" height="5" fill="#0D1B2A"/><rect x="78" y="58" width="5" height="5" fill="#0D1B2A"/>
        <rect x="88" y="66" width="5" height="5" fill="#0D1B2A"/><rect x="76" y="78" width="5" height="5" fill="#0D1B2A"/><rect x="88" y="86" width="5" height="5" fill="#0D1B2A"/>
        <rect x="60" y="82" width="5" height="5" fill="#0D1B2A"/><rect x="48" y="88" width="5" height="5" fill="#0D1B2A"/><rect x="34" y="86" width="5" height="5" fill="#0D1B2A"/>
      </svg>
      <span style="position:absolute; bottom:10px; right:10px; width:26px; height:26px; border-radius:50%; background:rgba(13,27,42,0.85); display:flex; align-items:center; justify-content:center;">
        <svg class="icon" viewBox="0 0 24 24" style="width:13px; height:13px; color:#fff; stroke-width:2.4;"><path d="M4 8V5a1 1 0 0 1 1-1h3"/><path d="M16 4h3a1 1 0 0 1 1 1v3"/><path d="M20 16v3a1 1 0 0 1-1 1h-3"/><path d="M8 20H5a1 1 0 0 1-1-1v-3"/></svg>
      </span>
      <div style="font-size:12.5px; font-weight:600; color:#14213D; margin-top:8px;">Scan with GCash</div>
      <div style="font-size:10px; color:#6B7A8F; margin-top:1px;">Tap to enlarge</div>
    </button>
      <button class="pf-chip" style="display:flex; align-items:center; gap:4px; background:none; border:none; color:#8A6A1F; font-size:11px; font-weight:600; margin-top:4px; cursor:pointer; padding:4px;">
        <svg class="icon" viewBox="0 0 24 24" style="width:11px; height:11px; color:#8A6A1F;"><path d="M12 3v12"/><polyline points="7 10 12 15 17 10"/><path d="M5 19h14"/></svg>
        Save QR code
      </button>
    </div>

    <!-- amount + advance stepper -->
    <div style="margin-top:18px; padding:16px; border-radius:16px; background:rgba(20,42,66,0.5); border:1px solid rgba(255,255,255,0.1);">
      <div style="display:flex; align-items:baseline; justify-content:space-between; margin-bottom:14px;">
        <span style="font-size:11px; color:#93A2B8; text-transform:uppercase; letter-spacing:.04em;">Amount</span>
        <span id="pf-amount" style="font-family:'Space Grotesk',sans-serif; font-weight:800; font-size:26px;">&#8369;2,000</span>
      </div>
      <div style="display:flex; align-items:center; justify-content:space-between; padding-top:14px; border-top:1px solid rgba(255,255,255,0.08);">
        <div>
          <div style="font-size:12.5px; font-weight:600; color:#EDEFF2;">Pay ahead</div>
          <div id="pf-cycles-hint" style="font-size:11px; color:#93A2B8; margin-top:1px;">Cycles 7&ndash;8 &middot; Sep 1 &amp; Sep 15</div>
        </div>
        <div style="display:flex; align-items:center; gap:12px;">
          <button id="pf-step-minus" class="pf-chip" style="width:28px; height:28px; border-radius:8px; border:1px solid rgba(255,255,255,0.16); background:rgba(255,255,255,0.05); color:#EDEFF2; font-size:16px; font-weight:600; cursor:pointer; line-height:1;">&minus;</button>
          <span id="pf-step-count" style="font-family:'Space Grotesk',sans-serif; font-size:14px; font-weight:700; min-width:14px; text-align:center;">2</span>
          <button id="pf-step-plus" class="pf-chip" style="width:28px; height:28px; border-radius:8px; border:1px solid rgba(255,255,255,0.16); background:rgba(255,255,255,0.05); color:#EDEFF2; font-size:16px; font-weight:600; cursor:pointer; line-height:1;">+</button>
        </div>
      </div>
    </div>

    <!-- proof of payment -->
    <div style="margin-top:18px;">
      <div style="font-size:11px; color:#93A2B8; text-transform:uppercase; letter-spacing:.04em; margin-bottom:8px;">Proof of payment</div>
      <div style="display:flex; align-items:center; gap:12px; padding:10px; border-radius:14px; background:rgba(76,175,131,0.08); border:1px solid rgba(76,175,131,0.3);">
        <div style="position:relative; width:52px; height:52px; border-radius:10px; background:linear-gradient(135deg, #2A4A68, #3D6488); flex-shrink:0; overflow:hidden;">
          <svg class="icon" viewBox="0 0 24 24" style="width:20px; height:20px; color:rgba(255,255,255,0.5); position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M21 16l-5-5-4 4-3-3-4 4"/></svg>
          <span style="position:absolute; bottom:2px; right:2px; width:16px; height:16px; border-radius:50%; background:#4CAF83; display:flex; align-items:center; justify-content:center;">
            <svg class="icon" viewBox="0 0 24 24" style="width:9px; height:9px; color:#08130E; stroke-width:3.4;"><polyline points="4 12 10 18 20 6"/></svg>
          </span>
        </div>
        <div style="flex:1; min-width:0;">
          <div style="font-size:12.5px; font-weight:600; color:#EDEFF2; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">payment-screenshot.jpg</div>
          <div style="font-size:11px; color:#93A2B8; margin-top:1px;">1.2 MB &middot; attached</div>
        </div>
        <button class="pf-chip" style="background:none; border:none; color:#F5A623; font-size:11.5px; font-weight:600; text-decoration:underline; cursor:pointer; padding:6px; flex-shrink:0;">Change</button>
      </div>
    </div>

    <button class="pf-cta" style="width:100%; height:54px; margin-top:20px; border:none; border-radius:16px; background:linear-gradient(135deg, #F5A623, #FFC966); color:#14213D; font-family:'Inter',sans-serif; font-weight:700; font-size:15px; cursor:pointer; box-shadow:0 14px 26px -10px rgba(245,166,35,0.5); transition:transform .1s ease;">I've sent this &middot; &#8369;2,000</button>
    <button class="pf-chip" style="width:100%; text-align:center; background:none; border:none; color:#93A2B8; font-family:'Inter',sans-serif; font-size:13px; font-weight:600; cursor:pointer; padding:12px 0 2px;">Cancel</button>
  </div>

  <!-- QR zoom lightbox — hidden until tapped -->
  <div id="pf-lightbox" style="position:absolute; inset:0; z-index:10; background:rgba(5,10,18,0.94); display:none; flex-direction:column; align-items:center; justify-content:center; gap:20px; padding:20px;">
    <div style="padding:20px; border-radius:20px; background:#fff;">
      <svg viewBox="0 0 100 100" style="width:230px; height:230px;">
        <rect x="6" y="6" width="18" height="18" fill="none" stroke="#0D1B2A" stroke-width="4"/><rect x="12" y="12" width="6" height="6" fill="#0D1B2A"/>
        <rect x="76" y="6" width="18" height="18" fill="none" stroke="#0D1B2A" stroke-width="4"/><rect x="82" y="12" width="6" height="6" fill="#0D1B2A"/>
        <rect x="6" y="76" width="18" height="18" fill="none" stroke="#0D1B2A" stroke-width="4"/><rect x="12" y="82" width="6" height="6" fill="#0D1B2A"/>
        <rect x="34" y="10" width="5" height="5" fill="#0D1B2A"/><rect x="44" y="10" width="5" height="5" fill="#0D1B2A"/><rect x="54" y="16" width="5" height="5" fill="#0D1B2A"/>
        <rect x="34" y="22" width="5" height="5" fill="#0D1B2A"/><rect x="60" y="28" width="5" height="5" fill="#0D1B2A"/><rect x="40" y="34" width="5" height="5" fill="#0D1B2A"/>
        <rect x="50" y="40" width="5" height="5" fill="#0D1B2A"/><rect x="66" y="40" width="5" height="5" fill="#0D1B2A"/><rect x="30" y="46" width="5" height="5" fill="#0D1B2A"/>
        <rect x="58" y="50" width="5" height="5" fill="#0D1B2A"/><rect x="70" y="54" width="5" height="5" fill="#0D1B2A"/><rect x="40" y="58" width="5" height="5" fill="#0D1B2A"/>
        <rect x="34" y="66" width="5" height="5" fill="#0D1B2A"/><rect x="46" y="70" width="5" height="5" fill="#0D1B2A"/><rect x="60" y="66" width="5" height="5" fill="#0D1B2A"/>
        <rect x="76" y="34" width="5" height="5" fill="#0D1B2A"/><rect x="86" y="44" width="5" height="5" fill="#0D1B2A"/><rect x="78" y="58" width="5" height="5" fill="#0D1B2A"/>
        <rect x="88" y="66" width="5" height="5" fill="#0D1B2A"/><rect x="76" y="78" width="5" height="5" fill="#0D1B2A"/><rect x="88" y="86" width="5" height="5" fill="#0D1B2A"/>
        <rect x="60" y="82" width="5" height="5" fill="#0D1B2A"/><rect x="48" y="88" width="5" height="5" fill="#0D1B2A"/><rect x="34" y="86" width="5" height="5" fill="#0D1B2A"/>
      </svg>
    </div>
    <button id="pf-lightbox-close" class="pf-chip" style="display:flex; align-items:center; gap:6px; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.16); color:#EDEFF2; font-family:'Inter',sans-serif; font-size:13.5px; font-weight:600; padding:10px 20px; border-radius:22px; cursor:pointer;">
      <svg class="icon" viewBox="0 0 24 24" style="width:14px; height:14px;"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
      Close
    </button>
  </div>

</div>
</x-dc>
<script data-dc-script>
class Component extends DCLogic {
  componentDidMount() {
    var count = 2;
    var perCycle = 1000;
    var startCycle = 7;
    var dates = { 7: 'Sep 1', 8: 'Sep 15', 9: 'Sep 29' };
    var maxCount = 3;
    var amountEl = document.getElementById('pf-amount');
    var countEl = document.getElementById('pf-step-count');
    var hintEl = document.getElementById('pf-cycles-hint');
    var minusBtn = document.getElementById('pf-step-minus');
    var plusBtn = document.getElementById('pf-step-plus');
    var ctaBtn = document.querySelector('.pf-cta');
    var qrOpenBtn = document.getElementById('pf-qr-open');
    var lightbox = document.getElementById('pf-lightbox');
    var lightboxClose = document.getElementById('pf-lightbox-close');
    if (qrOpenBtn && lightbox) qrOpenBtn.addEventListener('click', function () { lightbox.style.display = 'flex'; });
    if (lightboxClose && lightbox) lightboxClose.addEventListener('click', function () { lightbox.style.display = 'none'; });
    if (lightbox) lightbox.addEventListener('click', function (e) { if (e.target === lightbox) lightbox.style.display = 'none'; });
    function fmt(n) { return '₱' + n.toLocaleString('en-PH'); }
    function render() {
      var total = count * perCycle;
      amountEl.textContent = fmt(total);
      countEl.textContent = String(count);
      if (ctaBtn) ctaBtn.textContent = "I've sent this · " + fmt(total);
      var endCycle = startCycle + count - 1;
      var label = count === 1
        ? ('Cycle ' + startCycle + ' · ' + dates[startCycle])
        : ('Cycles ' + startCycle + '–' + endCycle + ' · ' + dates[startCycle] + ' & ' + dates[endCycle]);
      hintEl.textContent = label;
      if (minusBtn) minusBtn.style.opacity = count <= 1 ? '0.35' : '1';
      if (plusBtn) plusBtn.style.opacity = count >= maxCount ? '0.35' : '1';
    }
    if (minusBtn) minusBtn.addEventListener('click', function () { if (count > 1) { count -= 1; render(); } });
    if (plusBtn) plusBtn.addEventListener('click', function () { if (count < maxCount) { count += 1; render(); } });
    render();
  }
}
</script>
</body>
</html>
