<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    .icon { display: block; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .pf-fade { opacity: 0; animation: pfFadeUp .5s cubic-bezier(.22,1,.36,1) both; }
    @keyframes pfFadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .pf-cta:active { transform: scale(0.97); }
  </style>
</helmet>

<div style="position:relative; width:390px; height:700px; overflow:hidden; background:#0D1B2A; border-radius:38px; border:1px solid rgba(255,255,255,0.08); font-family:'Inter',sans-serif; color:#EDEFF2; display:flex; align-items:center; justify-content:center;">

  <div class="pf-fade" style="width:280px; text-align:center;">
    <div style="width:80px; height:80px; border-radius:22px; background:rgba(255,255,255,0.04); border:1px dashed rgba(255,255,255,0.16); display:flex; align-items:center; justify-content:center; margin:0 auto 22px;">
      <svg class="icon" viewBox="0 0 24 24" style="width:32px; height:32px; color:rgba(255,255,255,0.28);"><path d="M1 9l2 2c4.9-4.9 12.1-4.9 17 0l2-2C15.9 2.9 8.1 2.9 1 9Z" opacity="0.4"/><path d="M5 13l2 2c2.8-2.8 7.2-2.8 10 0l2-2c-4-4-10-4-14 0Z" opacity="0.4"/><path d="M9 17l2 2c1-1 3-1 4 0"/><line x1="3" y1="3" x2="21" y2="21"/></svg>
    </div>
    <div style="font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:18px; margin-bottom:8px;">No connection</div>
    <div style="font-size:13.5px; color:#93A2B8; line-height:1.6; margin-bottom:26px;">We couldn't load your fund data. Check your internet connection and try again.</div>
    <button class="pf-cta" style="width:100%; height:52px; border:none; border-radius:16px; background:linear-gradient(135deg, #F5A623, #FFC966); color:#14213D; font-family:'Inter',sans-serif; font-weight:700; font-size:14.5px; cursor:pointer;">Try again</button>
  </div>

</div>
</x-dc>
</body>
</html>
